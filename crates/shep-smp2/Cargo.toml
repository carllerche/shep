[package]
name = "shep-smp2"
description = "Native io_uring single-core runtime for Shep SMP: tasks, timers, I/O, files and TCP"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
[lints]
workspace = true
[dependencies]
io-uring.workspace = true
libc.workspace = true
pin-project-lite.workspace = true
shep-sys.workspace = true
shep-util-slab.workspace = true
slab.workspace = true

[dev-dependencies]
criterion.workspace = true
io-uring = { workspace = true, features = ["io_safety"] }
shep-futures.workspace = true
tempfile.workspace = true
tokio = { version = "1", default-features = false, features = ["sync", "rt"] }

[[bench]]
name = "runtime"
harness = false

[[bench]]
name = "driver"
path = "benches/io/driver.rs"
harness = false

[[bench]]
name = "tasks"
path = "benches/task/tasks.rs"
harness = false

[[bench]]
name = "timers"
path = "benches/time/timers.rs"
harness = false

[features]
# Native allocator instrumentation; incompatible with weft's simulated allocator.
allocation-tests = []
