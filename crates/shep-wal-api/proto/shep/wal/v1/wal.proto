// The WAL's client protocol: front ends propose mutations, and every reader
// of the log (materializers, tailers) streams committed entries (design §10).
syntax = "proto3";

package shep.wal.v1;

service Wal {
  // Validates a proposal against the partition's recent writes and, if it
  // passes, appends and commits it (§10.3). Only the leader accepts.
  rpc Propose(ProposeRequest) returns (ProposeResponse);

  // Streams committed entries of one partition, in log order, from
  // `from_index` on. Any replica serves it.
  rpc Tail(TailRequest) returns (stream TailResponse);

  // What this node knows about one partition's Raft group.
  rpc Status(StatusRequest) returns (StatusResponse);
}

service WalAdmin {
  // Creates the partition's local Raft replica, empty. Idempotent.
  rpc CreatePartition(CreatePartitionRequest) returns (CreatePartitionResponse);

  // Initializes a created partition's group with its first members. Called
  // on one member, once.
  rpc InitializePartition(InitializePartitionRequest) returns (InitializePartitionResponse);
}

// ---- versions (design §9) ----

message Dot {
  uint64 partition = 1;
  uint64 index = 2;
}

message Dvv {
  repeated DvvPart parts = 1;
}

message DvvPart {
  uint64 partition = 1;
  uint64 prefix = 2;
  repeated uint64 extras = 3;
}

// ---- proposals ----

// Keys in the WAL's conflict space: `[start, end)`, or `[start, ∞)` when
// `end` is absent.
message KeyRange {
  bytes start = 1;
  optional bytes end = 2;
}

message Proposal {
  // Required. The key's first decided outcome is its only outcome (§10.3).
  bytes idempotency_key = 1;
  oneof kind {
    Mutation mutation = 2;
    Failure failure = 3;
  }
}

message Mutation {
  // `S`: the version the mutation read at.
  Dvv read_version = 1;
  // The mutation's causal past (§9.5). Must include `read_version`.
  Dvv context = 2;
  // Every key and range it read in this partition.
  repeated KeyRange read_set = 3;
  // Every key and range it writes in this partition.
  repeated KeyRange write_set = 4;
  // The entry's content (delta, footprint, intent metadata), opaque here.
  bytes payload = 5;
  // What the front end returns to its client; returned to retries.
  bytes reply = 6;
}

// Records that the request under this key failed, so that the failure is the
// key's one outcome, unless the key already has one.
message Failure {
  bytes reply = 1;
}

message ProposeRequest {
  uint64 partition = 1;
  Proposal proposal = 2;
}

message ProposeResponse {
  oneof result {
    Decided decided = 1;
    Rejected rejected = 2;
  }
}

// The idempotency key's outcome. A retry gets the original's.
message Decided {
  Dot dot = 1;
  uint64 commit_time_us = 2;
  DecidedStatus status = 3;
  bytes reply = 4;
}

enum DecidedStatus {
  DECIDED_STATUS_UNSPECIFIED = 0;
  DECIDED_STATUS_COMMITTED = 1;
  DECIDED_STATUS_FAILED = 2;
}

message Rejected {
  RejectReason reason = 1;
  // With NOT_LEADER: the leader, if this node knows it.
  optional Member leader = 2;
  string message = 3;
}

enum RejectReason {
  REJECT_REASON_UNSPECIFIED = 0;
  // A write the mutation didn't see touched its read set: re-execute.
  REJECT_REASON_CONTENDED = 1;
  // The read version is older than the validation window: re-execute.
  REJECT_REASON_TOO_OLD = 2;
  // Send the same proposal to the leader.
  REJECT_REASON_NOT_LEADER = 3;
  // This node doesn't host the partition.
  REJECT_REASON_UNKNOWN_PARTITION = 4;
  // The outcome isn't known: send the same proposal again.
  REJECT_REASON_UNKNOWN_OUTCOME = 5;
  // The proposal is malformed.
  REJECT_REASON_INVALID = 6;
}

message Member {
  uint64 node_id = 1;
  string addr = 2;
}

// ---- reading the log ----

message TailRequest {
  uint64 partition = 1;
  uint64 from_index = 2;
}

message TailResponse {
  repeated LogEntry entries = 1;
}

message LogEntry {
  uint64 index = 1;
  uint64 term = 2;
  oneof kind {
    // Raft's own entries: a leader's no-op, membership changes.
    Internal internal = 3;
    // An entry appended under a later term than it was validated in. It
    // stamps nothing and decides nothing.
    Void void = 4;
    MutationEntry mutation = 5;
    FailureEntry failure = 6;
  }
}

message Internal {}

message Void {}

message MutationEntry {
  Dvv context = 1;
  uint64 commit_time_us = 2;
  bytes idempotency_key = 3;
  bytes payload = 4;
}

message FailureEntry {
  uint64 commit_time_us = 1;
  bytes idempotency_key = 2;
}

// ---- status and admin ----

message StatusRequest {
  uint64 partition = 1;
}

message StatusResponse {
  uint64 node_id = 1;
  uint64 term = 2;
  optional Member leader = 3;
  // Highest index in this replica's log.
  uint64 last_log_index = 4;
  // Highest index this replica knows committed and has applied.
  optional uint64 applied_index = 5;
  repeated Member voters = 6;
}

message CreatePartitionRequest {
  uint64 partition = 1;
}

message CreatePartitionResponse {}

message InitializePartitionRequest {
  uint64 partition = 1;
  repeated Member members = 2;
}

message InitializePartitionResponse {}
