[workspace]
resolver = "3"
members = ["crates/*", "tests/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
shep-append = { path = "crates/shep-append" }
shep-codec = { path = "crates/shep-codec" }
shep-codec-derive = { path = "crates/shep-codec-derive" }
shep-futures = { path = "crates/shep-futures" }
shep-node = { path = "crates/shep-node" }
shep-raft = { path = "crates/shep-raft" }
shep-raft-engine = { path = "crates/shep-raft-engine", default-features = false }
shep-rpc = { path = "crates/shep-rpc" }
shep-rpc-client = { path = "crates/shep-rpc-client" }
shep-rpc-server = { path = "crates/shep-rpc-server" }
shep-smp = { path = "crates/shep-smp" }
shep-smp-exec = { path = "crates/shep-smp-exec" }
shep-smp-task = { path = "crates/shep-smp-task" }
shep-smp-time = { path = "crates/shep-smp-time" }
shep-smp-io = { path = "crates/shep-smp-io" }
shep-smp-io-scheduler = { path = "crates/shep-smp-io-scheduler" }
shep-storage = { path = "crates/shep-storage" }
shep-version = { path = "crates/shep-version" }
shep-wal = { path = "crates/shep-wal" }
shep-wal-api = { path = "crates/shep-wal-api" }
shep-wal-client = { path = "crates/shep-wal-client" }
shep-wal-controller = { path = "crates/shep-wal-controller" }

bytes = "1"
core_affinity = "0.8"
crc32c = "0.6"
futures-core = "0.3"
hegeltest = "0.50"
io-uring = "0.7"
libc = "0.2"
pin-project-lite = "0.2"
proc-macro2 = "1"
quote = "1"
rand = "0.9"
serde = "1"
slab = "0.4"
syn = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-stream = { version = "0.1", features = ["net", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
trybuild = "1"
xxhash-rust = { version = "0.8", features = ["xxh64"] }

[workspace.lints.clippy]
# The types `clippy.toml` forbids, and why.
disallowed_types = "deny"
