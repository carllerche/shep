[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
shep-version = { path = "crates/shep-version" }
shep-wal = { path = "crates/shep-wal" }
shep-wal-api = { path = "crates/shep-wal-api" }
shep-wal-client = { path = "crates/shep-wal-client" }

bytes = "1"
crc32fast = "1"
futures = "0.3"
openraft = { version = "0.9.25", default-features = false, features = ["storage-v2", "generic-snapshot-data"] }
prost = "0.14"
protox = "0.10"
rand = "0.9"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net", "sync"] }
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
