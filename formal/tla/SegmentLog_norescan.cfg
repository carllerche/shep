\* EXPECTED TO FAIL: recovery never rescans the last segment (it trusts the
\* file as on a clean shutdown), so a torn batch is read as data.
CONSTANTS
  MaxAppend = 3
  MaxTerm = 2
  SegSize = 2
  MaxCrash = 2
  MaxStop = 1
  MaxSnap = 1
  MaxPrefix = 1
  SegDirSync = TRUE
  ClearMarker = TRUE
  SyncAfterTrunc = TRUE
  PersistStartFirst = TRUE
  SnapTmpSync = TRUE
  SnapDirSync = TRUE
  Rescan = FALSE
  RepairSync = TRUE
  ReopenAfterOpen = FALSE
  Gaps = "cut"
  Readers = {}
  MaxReads = 0
  TruncFlag = "atomic"
  ErrorPath = "none"
  MaxErr = 0
SPECIFICATION Spec
INVARIANT KvRecovers VoteNeverRegresses StartNeverRegresses NoReadIntoDeleted
INVARIANT FlushedSurvives RecoveredIsAppendedPrefix TruncatedNeverReappears
INVARIANT FilesPrefixRelated RunningLogMatches
