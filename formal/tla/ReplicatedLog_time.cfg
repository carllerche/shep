  Servers = {s1, s2, s3}
  Prog <- ProgTwo
  MaxSends = 1
  Emb = "occ"
  MaxTerm = 2
  MaxLen = 4
  MaxTime = 2
  Ticks = FALSE
  W = 1
  AW = 0
  WinEntries = 1
  FloorMode = "impl"
  FloorRule = TRUE
  PendingRule = "block"
  Evict = FALSE
  VoidRule = "all"
  Seed = "fix"
  MctVoid = TRUE
  LeadDrop = TRUE
  ReplayUncommitted = TRUE
  ReplayVoid = FALSE
  DiscardNA = FALSE
  ResolveTwice = FALSE
  WaitInFlight = TRUE
  SnapKeys = TRUE
  Snapshots = FALSE
  MaxCrash = 0
  LeaseToggle = FALSE
  Oversize = FALSE
  CtlId = "apply"
  CtlRecheck = TRUE
SYMMETRY Sym
SPECIFICATION Spec
INVARIANT Safety
