\* PASS. Commit times and the idempotency window, the landed fix, today's
\* config (no snapshots): the rebuild walk of proposer.rs (FloorMode "impl",
\* WinEntries = 1), clocks skewed 0..2 (fixed), W = 1 so keys are forgotten;
\* seed = max(applied max incl. void, replayed tail).
