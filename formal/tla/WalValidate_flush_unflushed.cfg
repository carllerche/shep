\* EXPECTED TO FAIL (W8): commit counts appended but unflushed entries; a
\* crash then loses a committed entry from the majority that held it.
CONSTANTS
  Servers = {s1, s2, s3}
  Prog <- ProgSmall
  MaxTerm = 2
  MaxLen = 4
  MaxExec = 2
  MaxWin = 0
  MaxIWin = 0
  MaxExpire = 0
  Fence = TRUE
  TableAt = "append"
  Rebuild = TRUE
  IdemAt = "append"
  CheckRanges = TRUE
  CheckTooOld = TRUE
  Truncation = FALSE
  TruncFix = FALSE
  FailMode = "logged"
  Split = FALSE
  VoidRule = FALSE
  Durability = "unflushed"
  MaxCrash = 1
  MarkRetry = TRUE
  HitReply = "wait"
  Refusal = "none"
  RecvOrder = "fifo"
  LeaseWindow = TRUE
SYMMETRY Sym
SPECIFICATION Spec
INVARIANT LogSafety LeaderCompleteness RepliesDurable
INVARIANT Serializable NoUnseenConflict KeyCausal
INVARIANT RepliesDurable IdemOnce OneOutcome
