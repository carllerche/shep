\* REACHABILITY: must fail NeverFounded. Pledges permit founding at term 1,
\* with one message in flight; passing safety checks are not just deadlock.
CONSTANTS
  Scenario = "same3"
  Guard = "seedset"
  IdMode = "promise"
  PledgeExpiry = FALSE
  MaxTerm = 1
  MaxCrashes = 0
  MaxWipes = 0
  MaxReconf = 0
  MaxMsgs = 1
  DataMsgs = FALSE
SPECIFICATION Spec
CONSTRAINT Bound
INVARIANT NeverFounded
