\* PASS: lease-based claims with a claim retried after an unknown outcome
\* through another front end (c1 runs twice), so the retry must return the
\* original task and generation; no leader change.
CONSTANTS
  Servers = {s1, s2, s3}
  Prog <- ProgClaim
  MaxTerm = 1
  MaxLen = 5
  MaxExec = 2
  MaxWin = 0
  MaxIWin = 0
  MaxExpire = 1
  Fence = TRUE
  TableAt = "append"
  Rebuild = TRUE
  IdemAt = "append"
  CheckRanges = TRUE
  CheckTooOld = TRUE
  Truncation = FALSE
  TruncFix = FALSE
  FailMode = "logged"
SYMMETRY Sym
SPECIFICATION Spec
INVARIANT TypeOK ElectionSafety LogSafety LeaderCompleteness
INVARIANT Serializable NoUnseenConflict TooOldEnforced TablesComplete
INVARIANT RepliesDurable KeyCausal IdemOnce OneOutcome
PROPERTY DeposedCommitsNothing
INVARIANT FenceHolds NoDoubleLease CompletedByHolder
