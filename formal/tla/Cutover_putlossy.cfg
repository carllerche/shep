  ActCtx = TRUE
  BackfillValidate = TRUE
  BackfillSnap = "afterBarrier"
  Redeliver = TRUE
  CursorRemap = "remap"
  AbandonAfterBackfill = FALSE
  WritePolicy = "putLossy"
  BaseCheck = TRUE
  WithSplit = TRUE
  WithNext = FALSE
  WithBase = FALSE
SPECIFICATION Spec
INVARIANT Inv_AbandonLossless
