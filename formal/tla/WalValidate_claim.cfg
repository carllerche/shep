\* PASS: lease-based claims (design update). Two workers each claim (n = 1),
\* then complete under the lease, fenced on its generation; the leader's
\* sweeper may expire any live lease by its own (adversarial) clock, twice.
\* One leader (terms <= 1), logs <= 6, one execution per request.
CONSTANTS
  Servers = {s1, s2, s3}
  Prog <- ProgClaim
  MaxTerm = 1
  MaxLen = 6
  MaxExec = 1
  MaxWin = 0
  MaxIWin = 0
  MaxExpire = 2
  Fence = TRUE
  TableAt = "append"
  Rebuild = TRUE
  IdemAt = "append"
  CheckRanges = TRUE
  CheckTooOld = TRUE
  Truncation = FALSE
  TruncFix = FALSE
  FailMode = "logged"
SYMMETRY Sym
SPECIFICATION Spec
INVARIANT TypeOK ElectionSafety LogSafety LeaderCompleteness
INVARIANT Serializable NoUnseenConflict TooOldEnforced TablesComplete
INVARIANT RepliesDurable KeyCausal IdemOnce OneOutcome
PROPERTY DeposedCommitsNothing
INVARIANT FenceHolds NoDoubleLease CompletedByHolder
