  AddGuard = TRUE
  Repurpose = TRUE
  MaxWipes = 1
  MaxCrashes = 1
  MaxLog = 4
  MaxClusters = 3
SPECIFICATION Spec
INVARIANT NoNodeInTwoClusters ProdNpNeverMix
