  MaxCores = 3
  CoreCounts = {1, 2, 3}
  InitCores = 3
  InitHomes = {0, 1, 2}
  RestartMode = "refuse"
  Cands = {"a", "b"}
  MaxTerm = 2
  MaxCfg = 1
  MaxLog = 1
  MaxCrashes = 3
  MaxMoves = 0
  LogPerCore = TRUE
  CopyLog = TRUE
  SkipShutdown = FALSE
  CopyEarly = FALSE
  CleanEarly = FALSE
  CleanupLog = FALSE
  MergeDropRecv = FALSE
  MergeRecvDone = FALSE
  ResumeLead = "restart"
  Fold = "none"
SPECIFICATION Spec
INVARIANT TypeOK NoTwoLive LiveIsHosted VoteSafety VoteNoRegress CfgNoRegress StartNoRegress LogNoRegress LeaderTermFresh NoGroupDropped PlacementConsistent
