\* EXPECTED TO FAIL: the read set validated at the sequencer holds the rows the
\* check found, but not the index range (and its ghost range) it scanned.
CONSTANTS
  Txns = {t1, t2}
  NN = 2
  Actors = {u1}
  MaxFirst = 1
  IndexGhosts = TRUE
  GhostEdges = TRUE
  EdgeSetDot = TRUE
  Visit = "all"
  PolicyInputs = "edge"
  PolicyDots = "all"
  EntryDots = "field+lifecycle"
  Walk = "toStop"
  PolicyTracked = TRUE
  StaleSnapshot = FALSE
  GuardWrites = TRUE
  CC = "occ"
  MultiPart = FALSE
  ValidateRemote = TRUE
  ReadSetRanges = FALSE
SYMMETRY Sym
SPECIFICATION Spec
INVARIANT AtomicityOCC
