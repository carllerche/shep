\* EXPECTED TO FAIL, every invariant (one at a time, or -continue; see
\* WalValidate_sanity.cfg): reachability of a
\* task re-claimed after its lease expired, and of a completion fenced out.
CONSTANTS
  Servers = {s1, s2, s3}
  Prog <- ProgClaim
  MaxTerm = 1
  MaxLen = 5
  MaxExec = 1
  MaxWin = 0
  MaxIWin = 0
  MaxExpire = 2
  Fence = TRUE
  TableAt = "append"
  Rebuild = TRUE
  IdemAt = "append"
  CheckRanges = TRUE
  CheckTooOld = TRUE
  Truncation = FALSE
  TruncFix = FALSE
  FailMode = "logged"
SYMMETRY Sym
SPECIFICATION Spec
INVARIANT NeverExpiredReclaimed NeverLeaseLost
