\* EXPECTED TO FAIL (S1, the log side): as SegmentLog_asis.cfg, checking only
\* the log's invariants, so the kvstore's failure (a vote) does not mask it.
\* A new segment's entries are fsynced and acknowledged, and a crash drops
\* the segment's directory entry.
CONSTANTS
  MaxAppend = 3
  MaxTerm = 2
  SegSize = 2
  MaxCrash = 2
  MaxStop = 1
  MaxSnap = 1
  MaxPrefix = 1
  SegDirSync = FALSE
  ClearMarker = TRUE
  SyncAfterTrunc = TRUE
  PersistStartFirst = TRUE
  SnapTmpSync = TRUE
  SnapDirSync = TRUE
  Rescan = TRUE
  RepairSync = TRUE
  ReopenAfterOpen = FALSE
  Gaps = "cut"
  Readers = {}
  MaxReads = 0
  TruncFlag = "atomic"
  ErrorPath = "none"
  MaxErr = 0
SPECIFICATION Spec
INVARIANT NoReadIntoDeleted FlushedSurvives RecoveredIsAppendedPrefix TruncatedNeverReappears
