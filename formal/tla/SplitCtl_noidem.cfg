\* EXPECTED TO FAIL (Inv_OneCommitPerKey): a child accepts before installing P's
\* idempotency table; a re-sent proposal commits a second time.
CONSTANTS
  ReqKey <- RK1
  With2PC = FALSE
  RouteBy = "entry"
  HandoffResume = TRUE
  CancelRule = "parent"
  RemoveOnStart = FALSE
  ChildEarly = FALSE
  IdemInstall = FALSE
  TooOld = TRUE
  DrainGuard = TRUE
  LostReplies = TRUE
  FreshReads = FALSE
  Crashes = 1
  MaxLen = 5
SPECIFICATION Spec
CONSTRAINT Bound
INVARIANT TypeOK NoLostAck Inv_OneCommitPerKey OneOwner NoOrphanedRange ValidationComplete NoStrandedPrepare
