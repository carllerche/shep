  PartHomeView = "prepare"
  HomeRule = "anchor"
  MatLookahead = TRUE
  ForgetRule = "deadline"
  Deadline = TRUE
  Dup = FALSE
  Barriers = FALSE
  RegCheck = "decide"
  Split = FALSE
  SplitCarry = TRUE
  Outages = FALSE
