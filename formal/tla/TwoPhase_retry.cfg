\* The design: anchor homes. One request, I, with two attempts (fresh
\* transaction IDs, one idempotency key). I reads y; if y is unwritten it
\* writes x and y, otherwise y and z, so a retry after the first attempt
\* committed has a different participant set. The anchor (y's partition) is
\* the home for both. Expected to pass.
