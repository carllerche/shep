\* EXPECTED TO FAIL (IndexExact): no barriers. The materializer maintains
\* the index for an entry iff the registry it was computed under names the
\* index; a stale front end's write skips the new index.
CONSTANTS
  ReqOf <- RQ2
  Changes = {"ix"}
  Barriers = FALSE
  BarrierRule = "max"
  Cutover = "barrier"
  EvalAtS = TRUE
  CheckRule = "barrier"
  MaxLen = 6
SPECIFICATION Spec
CONSTRAINT Bound
INVARIANT TypeOK BarrierCtx PolicyEnforced IndexExact ReplayEqual FreshnessSound
