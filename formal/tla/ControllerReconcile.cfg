\* Controller reconciliation (§9.6, after Redpanda's controller_backend):
\* moves as move/joint consensus/finish, cancels that reconfigure back to the
\* previous set, delete and recreate with log revisions checked. Two nodes,
\* one write, three admin commands. Expected to pass.
CONSTANTS
  n1 = n1
  n2 = n2
  w1 = w1
  Nodes = {n1, n2}
  Writes = {w1}
  MaxCmds = 3
  WithSplit = FALSE
  WithRecreate = TRUE
  CancelMode = "back"
  DeleteOnMove = FALSE
  CancelAfterFinish = FALSE
  RevCheck = TRUE
  RaftRevCheck = TRUE
SPECIFICATION Spec
CONSTRAINT CmdBound
SYMMETRY Sym
INVARIANT TypeOK QuorumKept NoLostAck CancelRestores NoConfusion
