\* PASS. Replication liveness of the landed driver under weak fairness with
\* one dropped message (or failed connection): a lost request leaves later
\* ones waiting, the gap timeout rejects them, the stream restarts as a new
\* session from seq 0 and catches up. Atomic elections, fair while the
\* newest term has no leader. Every follower converges, everything is
\* committed and known committed everywhere, and every stream with work left
\* makes progress.
CONSTANTS
  Servers = {s1, s2, s3}
  Nil = Nil
  Driver = "landed"
  MaxTerm = 2
  MaxClient = 1
  Budget = 0
  Window = 2
  MaxSess = 4
  UseSeq = FALSE
  MaxSeq = 0
  MaxBuf = 2
  MaxSlots = 1
  MaxCrash = 0
  MaxDrop = 1
  MaxDup = 0
  MaxFault = 0
  MaxXfer = 0
  MaxEnv = 0
  FreeNet = FALSE
  FreeTime = FALSE
  AtomicElect = TRUE
  Prevote = TRUE
  XferException = TRUE
  ReplyAfterFlush = TRUE
  LeaderSelf = "flushed"
  LeaderClamp = TRUE
  FollowerClamp = TRUE
  LeaderRestore = FALSE
  HbLeaseRule = FALSE
  CtrReset = FALSE
  SeqCheck = "none"
  SessionCheck = TRUE
  AckRule = "permatch"
  LwHb = TRUE
  SlotRelease = TRUE
SPECIFICATION LiveSpec
PROPERTY LeaderElected NoStarvation AllApplied StreamProgress GroupCommits
