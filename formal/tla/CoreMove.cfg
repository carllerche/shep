\* The implementation: a replica lives in cores/<k>/; at startup, if a core
\* directory at or above the configured count holds group state, startup
\* refuses (CoreRemoved); empty ones are ignored; a larger count is fine.
\* Nothing moves between cores. The group is created on any core; 3 crashes,
\* restarts to 1, 2 or 3 cores; every instance comes up a follower. Expected
\* to pass.
CONSTANTS
  MaxCores = 3
  CoreCounts = {1, 2, 3}
  InitCores = 3
  InitHomes = {0, 1, 2}
  RestartMode = "refuse"
  Cands = {"a", "b"}
  MaxTerm = 2
  MaxCfg = 1
  MaxLog = 1
  MaxCrashes = 3
  MaxMoves = 0
  LogPerCore = TRUE
  CopyLog = TRUE
  SkipShutdown = FALSE
  CopyEarly = FALSE
  CleanEarly = FALSE
  CleanupLog = FALSE
  MergeDropRecv = FALSE
  MergeRecvDone = FALSE
  ResumeLead = "none"
  Fold = "none"
SPECIFICATION Spec
INVARIANT TypeOK NoTwoLive LiveIsHosted VoteSafety VoteNoRegress CfgNoRegress StartNoRegress LogNoRegress LeaderTermFresh NoGroupDropped PlacementConsistent
