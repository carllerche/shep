\* EXPECTED TO FAIL (W3): the failure is confirmed with the anchor's leader
\* (confirmed as ReadIndex does: an own-term entry committed and a quorum in
\* its term), which returns the original outcome if it holds the key, but the
\* failure is not logged: the key stays unconsumed, and an original still in
\* flight, read at a newer S than the retry, commits after the client was told
\* the request failed. One leader (terms <= 1): no elections are needed.
CONSTANTS
  Servers = {s1, s2, s3}
  Prog <- ProgGuard2
  MaxTerm = 1
  MaxLen = 5
  MaxExec = 2
  MaxWin = 0
  MaxIWin = 0
  MaxExpire = 0
  Fence = TRUE
  TableAt = "append"
  Rebuild = TRUE
  IdemAt = "append"
  CheckRanges = TRUE
  CheckTooOld = TRUE
  Truncation = FALSE
  TruncFix = FALSE
  FailMode = "probe"
  Split = FALSE
  VoidRule = FALSE
  Durability = "sync"
  MaxCrash = 0
  MarkRetry = TRUE
  HitReply = "wait"
  Refusal = "none"
  RecvOrder = "fifo"
  LeaseWindow = TRUE
SYMMETRY Sym
SPECIFICATION Spec
INVARIANT Serializable NoUnseenConflict KeyCausal
INVARIANT RepliesDurable IdemOnce OneOutcome
