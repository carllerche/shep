\* EXPECTED TO FAIL (GrowthKeepsQuorum): a re-imaged member rejoins as a new identity added beside its dead old one; the new node becomes a single point of failure.
CONSTANTS
  Nodes = {"a", "b", "c", "x"}
  ProdSeeds = {"a", "b", "c"}
  NpSeeds = {"x"}
  NpNodes = {"x"}
  AllEmpty = TRUE
  Guard = "claim"
  UuidCheck = TRUE
  EnvCheck = TRUE
  Rejoin = "add"
  SecondAs = "learner"
  PromoteCheck = TRUE
  AddGuard = FALSE
  Repurpose = FALSE
  MaxWipes = 1
  MaxCrashes = 1
  MaxLog = 4
  MaxClusters = 3
SPECIFICATION Spec
INVARIANT OneClusterPerSeeds NoNodeInTwoClusters ProdNpNeverMix GrowthKeepsQuorum CommittedKept
