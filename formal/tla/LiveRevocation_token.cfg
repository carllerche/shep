\* The design, token model (§6.3, §13.2, §13.4, §16.4): g1 runs as (actor g1, viewer u1) under an external token that can expire; at expiry its stream pauses for reauth and its links die; the auth service can stop issuing tokens to g1, unseen by Shep. Deleting the actor or the viewer closes the stream. Expected to pass.
