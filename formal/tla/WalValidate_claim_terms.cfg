\* PASS: lease-based claims across a leader change (terms <= 2): worker 1
\* claims and completes, worker 2 claims; the sweeper of any leader, deposed or
\* not, may expire a live lease once. Logs <= 5.
CONSTANTS
  Servers = {s1, s2, s3}
  Prog <- ProgClaimLC
  MaxTerm = 2
  MaxLen = 5
  MaxExec = 1
  MaxWin = 0
  MaxIWin = 0
  MaxExpire = 1
  Fence = TRUE
  TableAt = "append"
  Rebuild = TRUE
  IdemAt = "append"
  CheckRanges = TRUE
  CheckTooOld = TRUE
  Truncation = FALSE
  TruncFix = FALSE
  FailMode = "logged"
  Split = FALSE
  VoidRule = FALSE
  Durability = "sync"
  MaxCrash = 0
  MarkRetry = TRUE
  HitReply = "wait"
  Refusal = "none"
  RecvOrder = "fifo"
  LeaseWindow = TRUE
SYMMETRY Sym
SPECIFICATION Spec
INVARIANT TypeOK ElectionSafety LogSafety LeaderCompleteness
INVARIANT Serializable NoUnseenConflict TooOldEnforced TablesComplete
INVARIANT RepliesDurable KeyCausal IdemOnce OneOutcome VoidNeverFires
PROPERTY DeposedCommitsNothing
INVARIANT FenceHolds NoDoubleLease CompletedByHolder
