\* EXPECTED TO FAIL (HandoffC1): only the leader that appended the split
\* entry sends the handoff, from memory; it crashes after the entry commits.
CONSTANTS
  ReqKey <- RK1
  With2PC = FALSE
  RouteBy = "entry"
  HandoffResume = FALSE
  CancelRule = "parent"
  RemoveOnStart = FALSE
  ChildEarly = FALSE
  IdemInstall = TRUE
  TooOld = TRUE
  DrainGuard = TRUE
  LostReplies = FALSE
  FreshReads = TRUE
  Crashes = 1
  MaxLen = 5
SPECIFICATION LiveSpec
CONSTRAINT Bound
PROPERTY FEProgress DrainTerminates TFinishes HandoffC1
