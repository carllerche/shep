\* EXPECTED TO FAIL (GrowthKeepsQuorum): as written, a join adds a voter even while another voter is dead (re-imaged and repurposed, never coming back); the newcomer becomes critical. Otherwise the design with this model's fixes.
CONSTANTS
  Nodes = {"a", "b", "c", "x"}
  ProdSeeds = {"a", "b", "c"}
  NpSeeds = {"x"}
  NpNodes = {"x"}
  AllEmpty = TRUE
  Guard = "claim"
  UuidCheck = TRUE
  EnvCheck = TRUE
  Rejoin = "replace"
  SecondAs = "learner"
  PromoteCheck = TRUE
  AddGuard = FALSE
  Repurpose = TRUE
  MaxWipes = 2
  MaxCrashes = 1
  MaxLog = 5
  MaxClusters = 3
SPECIFICATION Spec
INVARIANT OneClusterPerSeeds NoNodeInTwoClusters ProdNpNeverMix GrowthKeepsQuorum CommittedKept
