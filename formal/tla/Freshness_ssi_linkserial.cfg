\* Passes (this is the cost under Postgres): the edge-set dot is a column of the
\* source row, so two links or unlinks through one source never overlap.
CONSTANTS
  Txns = {t1, t2}
  NN = 2
  Actors = {u1, u2}
  MaxFirst = 1
  IndexGhosts = TRUE
  GhostEdges = TRUE
  EdgeSetDot = TRUE
  Visit = "all"
  PolicyInputs = "edge"
  PolicyDots = "all"
  EntryDots = "field+lifecycle"
  Walk = "toStop"
  PolicyTracked = TRUE
  StaleSnapshot = FALSE
  GuardWrites = TRUE
  CC = "ssi"
  MultiPart = FALSE
  ValidateRemote = TRUE
  ReadSetRanges = TRUE
SYMMETRY Sym
SPECIFICATION Spec
INVARIANT NoConcurrentLinksOnOneSource
