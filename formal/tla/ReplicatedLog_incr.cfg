\* PASS. The incr embedder (leader-resolved operations deriving a value from
\* the newest slot on their object, like §8 field operations) with PendingRule =
\* "block": a pending slot on the object makes the proposal contended. Lease
\* lapses and oversize commands on; one term, logs <= 4.
CONSTANTS
  Servers = {s1, s2, s3}
  Prog <- ProgTwo
  MaxSends = 1
  Emb = "incr"
  MaxTerm = 1
  MaxLen = 4
  MaxTime = 0
  Ticks = FALSE
  W = 5
  AW = 0
  WinEntries = 9
  FloorMode = "any"
  FloorRule = TRUE
  PendingRule = "block"
  Evict = FALSE
  VoidRule = "all"
  Seed = "fix"
  MctVoid = TRUE
  LeadDrop = TRUE
  ReplayUncommitted = TRUE
  ReplayVoid = FALSE
  DiscardNA = FALSE
  ResolveTwice = FALSE
  WaitInFlight = TRUE
  SnapKeys = TRUE
  Snapshots = FALSE
  MaxCrash = 0
  LeaseToggle = TRUE
  Oversize = TRUE
  CtlId = "apply"
  CtlRecheck = TRUE
SYMMETRY Sym
SPECIFICATION Spec
INVARIANT Safety
