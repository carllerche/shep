\* EXPECTED TO FAIL (NoConfusion): replicas aren't checked by log revision; a
\* node that applies delete and recreate before reconciling keeps the old
\* group's replica and serves the new group from it.
CONSTANTS
  n1 = n1
  n2 = n2
  w1 = w1
  Nodes = {n1, n2}
  Writes = {w1}
  MaxCmds = 3
  WithSplit = FALSE
  WithRecreate = TRUE
  CancelMode = "back"
  DeleteOnMove = FALSE
  CancelAfterFinish = FALSE
  RevCheck = FALSE
  RaftRevCheck = TRUE
SPECIFICATION Spec
CONSTRAINT CmdBound
SYMMETRY Sym
INVARIANT TypeOK QuorumKept NoLostAck CancelRestores NoConfusion
