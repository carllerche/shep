\* EXPECTED TO FAIL, every invariant: reachability checks. Run with -continue,
\* or one invariant at a time (-continue reports only the first invariant a
\* state violates, so a later one can be masked). Each Never* invariant
\* negates a scenario the passing configs rely on being reachable: recovery
\* trusting the marker, cutting a torn tail, keeping intact unflushed
\* entries, dropping a stale segment, running after a crash during recovery;
\* a completed suffix and prefix truncation; a roll; a vote recovered after a
\* crash.
CONSTANTS
  MaxAppend = 2
  MaxTerm = 2
  SegSize = 1
  MaxCrash = 2
  MaxStop = 1
  MaxSnap = 0
  MaxPrefix = 1
  SegDirSync = TRUE
  ClearMarker = TRUE
  SyncAfterTrunc = TRUE
  PersistStartFirst = TRUE
  SnapTmpSync = TRUE
  SnapDirSync = TRUE
  Rescan = TRUE
  RepairSync = TRUE
  ReopenAfterOpen = FALSE
  Gaps = "cut"
  Readers = {}
  MaxReads = 0
  TruncFlag = "atomic"
  ErrorPath = "none"
  MaxErr = 0
SPECIFICATION Spec
INVARIANT NeverSkip NeverTornDropped NeverUnflushedKept NeverStaleDropped
INVARIANT NeverRecoveryCrash NeverTruncated NeverPrefixTruncated NeverRolled
INVARIANT NeverVoteRecovered
