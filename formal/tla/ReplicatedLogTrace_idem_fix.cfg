\* The same script with the landed fix: it runs to its end (TraceIncomplete
\* is reported violated) with Safety holding in every state.
CONSTANTS
  s1 = s1
  s2 = s2
  s3 = s3
  Servers = {s1, s2, s3}
  Prog <- ProgTwo
  MaxSends = 2
  Emb = "occ"
  MaxTerm = 2
  MaxLen = 5
  MaxTime = 2
  Ticks = TRUE
  W = 1
  AW = 0
  WinEntries = 1
  FloorMode = "impl"
  FloorRule = TRUE
  PendingRule = "block"
  Evict = FALSE
  VoidRule = "all"
  Seed = "fix"
  MctVoid = TRUE
  LeadDrop = TRUE
  ReplayUncommitted = TRUE
  ReplayVoid = FALSE
  DiscardNA = FALSE
  ResolveTwice = FALSE
  WaitInFlight = TRUE
  SnapKeys = TRUE
  Snapshots = FALSE
  MaxCrash = 0
  LeaseToggle = FALSE
  Oversize = FALSE
  CtlId = "apply"
  CtlRecheck = TRUE
  Script = "idem"
SPECIFICATION TSpec
INVARIANT Safety TraceIncomplete
