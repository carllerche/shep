\* EXPECTED TO FAIL: `complete` does not read its lease (no fence): after the
\* sweeper expires a lease and another worker re-claims the task, the first
\* worker's completion still commits.
CONSTANTS
  Servers = {s1, s2, s3}
  Prog <- ProgClaim
  MaxTerm = 1
  MaxLen = 5
  MaxExec = 1
  MaxWin = 0
  MaxIWin = 0
  MaxExpire = 2
  Fence = FALSE
  TableAt = "append"
  Rebuild = TRUE
  IdemAt = "append"
  CheckRanges = TRUE
  CheckTooOld = TRUE
  Truncation = FALSE
  TruncFix = FALSE
  FailMode = "logged"
SYMMETRY Sym
SPECIFICATION Spec
INVARIANT Serializable NoUnseenConflict KeyCausal
INVARIANT RepliesDurable IdemOnce OneOutcome
INVARIANT FenceHolds NoDoubleLease
