\* Old readers switch lens at activation, and no registry dot is counted at all.
\* Expected to PASS Inv_Lens: see FINDINGS (CU-lensact).
CONSTANTS
  MaxWrites = 2
  LensSwitch = "activation"
  LensKey = "registry"
  CountDots = {}
  UniqueEnforce = "index"
  ActCheckUnique = TRUE
  ActCtx = TRUE
  BackfillValidate = TRUE
  BackfillSnap = "afterBarrier"
  Redeliver = TRUE
  CursorRemap = "remap"
  AbandonAfterBackfill = FALSE
  WritePolicy = "rejectLossy"
  BaseCheck = TRUE
  WithSplit = TRUE
  WithNext = FALSE
  WithBase = FALSE
SPECIFICATION Spec
INVARIANT TypeOK Inv_Shape Inv_DualWrite Inv_Lens Inv_ActivateGuard Inv_NoReturn Inv_One Inv_BarrierChild Inv_Cursor Inv_Base Inv_BaseAgree Inv_NoLostUpdate Inv_AbandonLossless Inv_SetFeasible
