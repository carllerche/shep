\* EXPECTED TO FAIL (S3): recovery cuts the torn tail of the last segment but
\* does not fsync the cut. Later appends go to a new segment, so after a
\* second crash the old segment is no longer last, is not rescanned, and its
\* torn tail can come back.
CONSTANTS
  MaxAppend = 3
  MaxTerm = 2
  SegSize = 2
  MaxCrash = 2
  MaxStop = 1
  MaxSnap = 1
  MaxPrefix = 1
  SegDirSync = TRUE
  ClearMarker = TRUE
  SyncAfterTrunc = TRUE
  PersistStartFirst = TRUE
  SnapTmpSync = TRUE
  SnapDirSync = TRUE
  Rescan = TRUE
  RepairSync = FALSE
  ReopenAfterOpen = FALSE
  Gaps = "cut"
  Readers = {}
  MaxReads = 0
  TruncFlag = "atomic"
  ErrorPath = "none"
  MaxErr = 0
SPECIFICATION Spec
INVARIANT KvRecovers VoteNeverRegresses StartNeverRegresses NoReadIntoDeleted
INVARIANT FlushedSurvives RecoveredIsAppendedPrefix TruncatedNeverReappears
INVARIANT FilesPrefixRelated RunningLogMatches
