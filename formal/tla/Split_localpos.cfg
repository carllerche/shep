  MovedCheck = TRUE
  ReleaseCtx = "decision"
  HandIdem = TRUE
  HandDecisions = TRUE
  HandReleased = TRUE
  ForgetRule = "deadline"
  Redeliver = TRUE
  FoldMode = "covered"
  KeyOrder = "local"
  ParentPad = 2
  Compaction = FALSE
  LostReplies = FALSE
  AllowCancel = FALSE
  MaxLen = 6
SPECIFICATION Spec
CONSTRAINT Bound
INVARIANT TypeOK NoLostAck Inv_OneCommitPerKey NoCommitAfterSplit ChildrenAfterSplit NoMisplacedCommit OneWriterPerKey BarrierCtx BarrierAcked LineageConsistent FoldExact FoldMonotone PhysicalWinner
