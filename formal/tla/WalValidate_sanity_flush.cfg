\* EXPECTED TO FAIL (reachability): under the flushed commit rule a leader
\* commits an index it has not flushed itself (two followers flushed it).
CONSTANTS
  Servers = {s1, s2, s3}
  Prog <- ProgSmall
  MaxTerm = 2
  MaxLen = 4
  MaxExec = 2
  MaxWin = 0
  MaxIWin = 0
  MaxExpire = 0
  Fence = TRUE
  TableAt = "append"
  Rebuild = TRUE
  IdemAt = "append"
  CheckRanges = TRUE
  CheckTooOld = TRUE
  Truncation = FALSE
  TruncFix = FALSE
  FailMode = "logged"
  Split = FALSE
  VoidRule = FALSE
  Durability = "flushed"
  MaxCrash = 1
  MarkRetry = TRUE
  HitReply = "wait"
  Refusal = "none"
  RecvOrder = "fifo"
  LeaseWindow = TRUE
SYMMETRY Sym
SPECIFICATION Spec
INVARIANT NeverLeaderUnflushedCommit
