\* PASS. Two readers concurrent with suffix and prefix truncation (no
\* crashes). The fix: the `truncating` flag is set in the step that bumps the
\* epoch, readers that see it wait for the log's lock and restart, and on a
\* failed or cancelled truncation the drop guard resets the metadata from
\* the files before it clears the flag (R1). Liveness: every reader
\* completes its read (weak fairness on readers and on started operations).
CONSTANTS
  MaxAppend = 3
  MaxTerm = 2
  SegSize = 2
  MaxCrash = 0
  MaxStop = 0
  MaxSnap = 0
