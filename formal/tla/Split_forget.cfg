\* EXPECTED TO FAIL (NoLostAck): the home forgets T's decision once every
\* participant has released (§8), before T's deadline, so a split doesn't hand
\* it off; the coordinator's delayed commit decision then reaches the home's
\* heir, which accepts it: the client is told "commit" for an aborted T.
CONSTANTS
  ReqKey <- RK1
  With2PC = TRUE
  THome = "P"
  WithDup = TRUE
  WithReg = FALSE
  Resplit = FALSE
  DrainGuard = TRUE
  FirstCtx = "parent"
  MovedCheck = TRUE
  ReleaseCtx = "decision"
  HandIdem = TRUE
  HandDecisions = TRUE
  HandReleased = TRUE
  ForgetRule = "released"
  Redeliver = TRUE
  FoldMode = "covered"
  KeyOrder = "lineage"
  ParentPad = 0
  Compaction = FALSE
  LostReplies = FALSE
  AllowCancel = FALSE
  MaxLen = 6
SPECIFICATION Spec
CONSTRAINT Bound
INVARIANT TypeOK NoLostAck Inv_OneCommitPerKey NoCommitAfterSplit ChildrenAfterSplit NoMisplacedCommit OneWriterPerKey BarrierCtx BarrierAcked LineageConsistent FoldExact FoldMonotone PhysicalWinner
