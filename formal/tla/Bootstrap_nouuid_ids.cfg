\* No cluster UUID check, but per-incarnation node identities (Rejoin = replace). Checks whether node identities alone keep clusters apart.
CONSTANTS
  Nodes = {"a", "b", "c", "x"}
  ProdSeeds = {"a", "b", "c"}
  NpSeeds = {"x"}
  NpNodes = {"x"}
  AllEmpty = TRUE
  Guard = "claim"
  UuidCheck = FALSE
  EnvCheck = TRUE
  Rejoin = "replace"
  SecondAs = "learner"
  PromoteCheck = TRUE
  AddGuard = TRUE
  Repurpose = TRUE
  MaxWipes = 2
  MaxCrashes = 1
  MaxLog = 5
  MaxClusters = 3
SPECIFICATION Spec
INVARIANT OneClusterPerSeeds NoNodeInTwoClusters ProdNpNeverMix GrowthKeepsQuorum CommittedKept
