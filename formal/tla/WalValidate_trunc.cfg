\* EXPECTED TO FAIL (W2): replicas truncate committed log prefixes (§10.4:
\* below what every materializer applied, or below a Raft snapshot), and a new
\* leader rebuilds its validation table from the entries its log still has
\* while enforcing too_old only against the time-based window.
CONSTANTS
  Servers = {s1, s2, s3}
  Prog <- ProgSmall
  MaxTerm = 2
  MaxLen = 4
  MaxExec = 2
  MaxWin = 0
  MaxIWin = 0
  MaxExpire = 0
  Fence = TRUE
  TableAt = "append"
  Rebuild = TRUE
  IdemAt = "append"
  CheckRanges = TRUE
  CheckTooOld = TRUE
  Truncation = TRUE
  TruncFix = FALSE
  FailMode = "logged"
SYMMETRY Sym
SPECIFICATION Spec
INVARIANT Serializable NoUnseenConflict KeyCausal
INVARIANT RepliesDurable IdemOnce OneOutcome
