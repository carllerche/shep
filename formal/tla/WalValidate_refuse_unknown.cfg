\* EXPECTED TO FAIL (W10): the key (and write set) released on an unknown
\* outcome: the front end's re-send validates afresh while the first copy is
\* appended, and both commit.
CONSTANTS
  Servers = {s1, s2, s3}
  Prog <- ProgTerms
  MaxTerm = 1
  MaxLen = 4
  MaxExec = 2
  MaxWin = 0
  MaxIWin = 0
  MaxExpire = 0
  Fence = TRUE
  TableAt = "append"
  Rebuild = TRUE
  IdemAt = "append"
  CheckRanges = TRUE
  CheckTooOld = TRUE
  Truncation = FALSE
  TruncFix = FALSE
  FailMode = "logged"
  Split = FALSE
  VoidRule = FALSE
  Durability = "sync"
  MaxCrash = 0
  MarkRetry = TRUE
  HitReply = "wait"
  Refusal = "unknown_release"
  RecvOrder = "fifo"
  LeaseWindow = TRUE
SYMMETRY Sym
SPECIFICATION Spec
INVARIANT Serializable NoUnseenConflict KeyCausal
INVARIANT RepliesDurable IdemOnce OneOutcome
