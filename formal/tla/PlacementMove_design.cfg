\* The design as written (§9.6): FOR SHARE ownership rows, activation context =
\* seal dot + T's snapshot, copy and cleanup log nothing. Write path only.
\* Expected to FAIL CausalReplay (finding P1: the seal's context can miss a
\* write that committed while the seal waited for its row lock).
CONSTANTS
  S = S
  T = T
  Ops <- OpsWrites
  MaxDot = 5
  ForShare = TRUE
  ActCtx = "seal"
  SealCtxLate = FALSE
  CopyLogsFacts = FALSE
  CleanupLogged = FALSE
  ReadRule = "design"
  SweepMode = "none"
  SweepNode = "cache"
  MaxCrashes = 1
  AllowRollback = TRUE
  MaxAttempts = 2
  MaxGen = 0
  WithLogReader = TRUE
  WithReader = FALSE
SPECIFICATION Spec
INVARIANT NoLostWrites SingleWriter CausalReplay
