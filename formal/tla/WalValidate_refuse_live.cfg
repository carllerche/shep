\* PASS (liveness): with a stable leader (one election), a proposal refused
\* during the lease window is re-sent and eventually validated, appended and
\* answered: every request gets an outcome. No symmetry (liveness).
CONSTANTS
  Servers = {s1, s2, s3}
  Prog <- ProgOne
  MaxTerm = 1
  MaxLen = 4
  MaxExec = 2
  MaxWin = 0
  MaxIWin = 0
  MaxExpire = 0
  Fence = TRUE
  TableAt = "append"
  Rebuild = TRUE
  IdemAt = "append"
  CheckRanges = TRUE
  CheckTooOld = TRUE
  Truncation = FALSE
  TruncFix = FALSE
  FailMode = "logged"
  Split = FALSE
  VoidRule = FALSE
  Durability = "sync"
  MaxCrash = 0
  MarkRetry = TRUE
  HitReply = "wait"
  Refusal = "design"
  RecvOrder = "fifo"
  LeaseWindow = TRUE
SPECIFICATION LiveSpec
INVARIANT NASound
PROPERTY EventuallyOutcome
