\* The design with the proposed check rule: barriers, the leader requires the
\* highest registry dot among its barriers, backfill at the barrier, front ends
\* evaluate under the registry at S, and a freshness check trusts an index's
\* ghosts only for V that contains the index's barrier dot in the partition.
\* Two registry changes (an index, a tighter policy), two writes. Expected to pass.
CONSTANTS
  ReqOf <- RQ2
  Changes = {"ix", "tight"}
  Barriers = TRUE
  BarrierRule = "max"
  Cutover = "barrier"
  EvalAtS = TRUE
  CheckRule = "barrier"
  MaxLen = 6
SPECIFICATION Spec
CONSTRAINT Bound
INVARIANT TypeOK BarrierCtx PolicyEnforced IndexExact ReplayEqual FreshnessSound
