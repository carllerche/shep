\* EXPECTED TO FAIL, every invariant: reachability of the landed stream
\* scenarios RaftDriver.cfg relies on: two leaders streams to one follower, a
\* deposed leader stale session rejected after a new one started, a leader
\* restarting its stream within a term, a gap rejection, a duplicate
\* rejection, a waiting request, a heartbeat reply overtaking outstanding
\* results, a commit. Run with -continue (TLC prints a trace for every
\* violating state: the output is gigabytes), or one invariant at a time.
CONSTANTS
  Servers = {s1, s2, s3}
  Nil = Nil
  Driver = "landed"
  MaxTerm = 2
  MaxClient = 1
  Budget = 4
  Window = 2
  MaxSess = 3
  UseSeq = FALSE
  MaxSeq = 0
  MaxBuf = 2
  MaxSlots = 1
  MaxCrash = 1
  MaxDrop = 0
  MaxDup = 0
  MaxFault = 0
  MaxXfer = 0
  MaxEnv = 0
  FreeNet = TRUE
  FreeTime = TRUE
  AtomicElect = TRUE
  Prevote = TRUE
  XferException = TRUE
  ReplyAfterFlush = TRUE
  LeaderSelf = "flushed"
  LeaderClamp = TRUE
  FollowerClamp = TRUE
  LeaderRestore = FALSE
  HbLeaseRule = FALSE
  CtrReset = FALSE
  SeqCheck = "none"
  SessionCheck = TRUE
  AckRule = "permatch"
  LwHb = TRUE
  SlotRelease = TRUE
SYMMETRY Sym
SPECIFICATION Spec
CONSTRAINT SentBound
INVARIANT NeverCommit NeverTwoStreams NeverStaleSessionRejected NeverRestartInTerm
INVARIANT NeverGapReject NeverDupReject NeverWaiting NeverHbOvertakes
