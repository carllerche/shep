\* EXPECTED TO FAIL, every invariant: reachability checks for the reader
\* configs (run with -continue): a reader waits on the flag, a reader restarts
\* on an epoch change, and a truncation fails.
CONSTANTS
  MaxAppend = 3
  MaxTerm = 2
  SegSize = 2
  MaxCrash = 0
  MaxStop = 0
  MaxSnap = 0
  MaxPrefix = 1
  SegDirSync = TRUE
  ClearMarker = TRUE
  SyncAfterTrunc = TRUE
  PersistStartFirst = TRUE
  SnapTmpSync = TRUE
  SnapDirSync = TRUE
  Rescan = TRUE
  RepairSync = TRUE
  ReopenAfterOpen = FALSE
  Gaps = "cut"
  Readers = {r1, r2}
  MaxReads = 1
  TruncFlag = "atomic"
  ErrorPath = "reconcile"
  MaxErr = 1
SPECIFICATION Spec
INVARIANT NeverReaderWaited NeverEpochRestart NeverTruncError
