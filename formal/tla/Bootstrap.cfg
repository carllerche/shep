\* The design with this model's fixes (claim, fleet check, replace on rejoin): three prod seeds, one np node; re-images may repurpose or misconfigure a node. Expected to pass.
CONSTANTS
  Nodes = {"a", "b", "c", "x"}
  ProdSeeds = {"a", "b", "c"}
  NpSeeds = {"x"}
  NpNodes = {"x"}
  AllEmpty = TRUE
  Guard = "claim"
  UuidCheck = TRUE
  EnvCheck = TRUE
  Rejoin = "replace"
  SecondAs = "learner"
  PromoteCheck = TRUE
  AddGuard = TRUE
  Repurpose = TRUE
  MaxWipes = 2
  MaxCrashes = 1
  MaxLog = 5
  MaxClusters = 3
SPECIFICATION Spec
INVARIANT OneClusterPerSeeds NoNodeInTwoClusters ProdNpNeverMix GrowthKeepsQuorum CommittedKept
