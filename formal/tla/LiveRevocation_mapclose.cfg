  RouteActsFor = TRUE
  MapRouteAt = "step"
  CloseOnMapped = TRUE
  DenyDeletedViewer = FALSE
  RouteRevoke = TRUE
  LinkDeletedCheck = TRUE
SPECIFICATION Spec
INVARIANT CloseOnlyIfDenied
