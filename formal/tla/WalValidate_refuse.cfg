\* PASS: the validator puts a Pending slot in its table and hands the entry
\* to raft, which appends it at receipt (leader, same term, lease established)
\* or refuses it, never appending; a refused slot becomes NotAppended
\* (conflicts with nothing, key released); discarded and unknown stay Pending.
\* Receipt is in validation order. One leader (terms <= 1): its lease window,
\* and a concurrent retry of the same key (q1 runs twice) beside a guard.
CONSTANTS
  Servers = {s1, s2, s3}
  Prog <- ProgTerms
  MaxTerm = 1
  MaxLen = 4
  MaxExec = 2
  MaxWin = 0
  MaxIWin = 0
  MaxExpire = 0
  Fence = TRUE
  TableAt = "append"
  Rebuild = TRUE
  IdemAt = "append"
  CheckRanges = TRUE
  CheckTooOld = TRUE
  Truncation = FALSE
  TruncFix = FALSE
  FailMode = "logged"
  Split = FALSE
  VoidRule = FALSE
  Durability = "sync"
  MaxCrash = 0
  MarkRetry = TRUE
  HitReply = "wait"
  Refusal = "design"
  RecvOrder = "fifo"
  LeaseWindow = TRUE
SYMMETRY Sym
SPECIFICATION Spec
INVARIANT TypeOK ElectionSafety LogSafety LeaderCompleteness
INVARIANT Serializable NoUnseenConflict TooOldEnforced TablesComplete
INVARIANT RepliesDurable KeyCausal IdemOnce OneOutcome VoidNeverFires
PROPERTY DeposedCommitsNothing
INVARIANT NASound
