\* CREATE_LOG_SET with the implementation's rules: admit against the applied
\* state, VOID across terms, apply re-checks; the create-only reconciler;
\* manual create only on the seedless node 3; a leader change and a crash.
\* Expected to pass.
\* Bounds: log sets of one partition, ids 1..2, at most 3 controller commands
\* (MaxId = 2 keeps the node-by-id replica states small; with 2-partition sets
\* and ids 1..4 the state space passes 185M states).
CONSTANTS
  w1 = w1
  Nodes = {1, 2, 3}
  Managed = {1, 2}
  Names = {"a", "b", "not a domain"}
  DomainNames = {"a", "b"}
  MaxPartitions = 2
  Counts = {1}
  MaxId = 2
  Writes = {w1}
  MaxTerm = 2
  VoidRule = TRUE
  ReCheck = TRUE
  ManualAnywhere = FALSE
  Crashes = 1
  MaxLog = 3
SPECIFICATION Spec
INVARIANT TypeOK VoidNoEffect RulesHold Disjoint CtlOnly NoInheritedData OneInit
