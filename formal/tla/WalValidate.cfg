\* PASS. The design (§10.3), with the fix for W3 (FailMode = "logged").
\* Write sets enter the validation table at append; a new leader rebuilds both
\* tables from every entry in its log, committed or not, before accepting;
\* idempotency is checked against appended entries; range predicates are
\* validated. 3 replicas, one leader change (terms <= 2), logs <= 4, requests
\* toggle a / guard b (1 execution each) and create (2 executions: a retry
\* through another front end). The window is in WalValidate_window.cfg.
CONSTANTS
  Servers = {s1, s2, s3}
  Prog <- ProgMain
  MaxTerm = 2
  MaxLen = 4
  MaxExec = 2
  MaxWin = 0
  MaxIWin = 0
  MaxExpire = 0
  Fence = TRUE
  TableAt = "append"
  Rebuild = TRUE
  IdemAt = "append"
  CheckRanges = TRUE
  CheckTooOld = TRUE
  Truncation = FALSE
  TruncFix = FALSE
  FailMode = "logged"
  Split = FALSE
  VoidRule = FALSE
  Durability = "sync"
  MaxCrash = 0
  MarkRetry = TRUE
  HitReply = "wait"
  Refusal = "none"
  RecvOrder = "fifo"
  LeaseWindow = TRUE
SYMMETRY Sym
SPECIFICATION Spec
INVARIANT TypeOK ElectionSafety LogSafety LeaderCompleteness
INVARIANT Serializable NoUnseenConflict TooOldEnforced TablesComplete
INVARIANT RepliesDurable KeyCausal IdemOnce OneOutcome VoidNeverFires
PROPERTY DeposedCommitsNothing
