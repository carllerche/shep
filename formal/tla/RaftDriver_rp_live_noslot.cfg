  Driver = "redpanda"
  MaxTerm = 3
  MaxClient = 1
  Budget = 0
  Window = 2
  MaxSess = 2
  UseSeq = FALSE
  MaxSeq = 0
  MaxBuf = 2
  MaxSlots = 1
  MaxCrash = 0
  MaxDrop = 2
  MaxDup = 0
  MaxFault = 0
  MaxXfer = 0
  MaxEnv = 0
  FreeNet = FALSE
  FreeTime = FALSE
  AtomicElect = TRUE
  Prevote = TRUE
  XferException = TRUE
  ReplyAfterFlush = TRUE
  LeaderSelf = "flushed"
  LeaderClamp = TRUE
  FollowerClamp = TRUE
  LeaderRestore = FALSE
  HbLeaseRule = FALSE
  CtrReset = FALSE
