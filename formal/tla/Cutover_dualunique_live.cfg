\* Liveness with the unique enforced only from DualWrite: backfill can stall
\* past the point of no return.
CONSTANTS
  MaxWrites = 1
  LensSwitch = "barrier"
  LensKey = "registry"
  CountDots = {"dual", "act", "abandon"}
  UniqueEnforce = "dual"
  ActCheckUnique = TRUE
  ActCtx = TRUE
  BackfillValidate = TRUE
  BackfillSnap = "afterBarrier"
  Redeliver = TRUE
  CursorRemap = "remap"
  AbandonAfterBackfill = FALSE
  WritePolicy = "rejectLossy"
  BaseCheck = TRUE
  WithSplit = TRUE
  WithNext = FALSE
  WithBase = FALSE
SPECIFICATION FairSpec
INVARIANT TypeOK
PROPERTY Live_Backfill
