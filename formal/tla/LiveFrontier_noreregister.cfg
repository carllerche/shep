\* SUPERSEDED: the mapping model (g1's viewer is its acts_for target, re-pointed by "remap"); see LiveFrontier_cred*.cfg for the credential model.
\* EXPECTED TO FAIL (ViewExact): mapped nodes are not re-registered at each step; g1 is remapped to u2, u2 is deleted, the deletion is not routed, and g1 (no viewer) keeps its view of C1.
CONSTANTS
  MaxEntries = 3
  MaxA = 1
  MaxB = 2
  MaxMsgs = 1
  MaxCrashes = 0
  OpsA = {"post"}
  OpsB = {"remap", "del"}
  Deps = FALSE
  Subs = {"g1"}
  Window = FALSE
  StepTo = "frontier"
  JoinMode = "loop"
  ReRegister = FALSE
  JoinWait = TRUE
  DenyDeletedViewer = FALSE
  LookupByViewerOnly = FALSE
  TopicStart = "latest"
SPECIFICATION Spec
INVARIANT TypeOK DeleteCloses PushSafe PushExact ViewExact
