\* EXPECTED TO FAIL: a new leader does not rebuild its tables from its log;
\* it keeps the tables it had when it last led (empty if it never led).
CONSTANTS
  Servers = {s1, s2, s3}
  Prog <- ProgTerms
  MaxTerm = 2
  MaxLen = 4
  MaxExec = 2
  MaxWin = 0
  MaxIWin = 0
  MaxExpire = 0
  Fence = TRUE
  TableAt = "append"
  Rebuild = FALSE
  IdemAt = "append"
  CheckRanges = TRUE
  CheckTooOld = TRUE
  Truncation = FALSE
  TruncFix = FALSE
  FailMode = "logged"
  Split = FALSE
  VoidRule = FALSE
  Durability = "sync"
  MaxCrash = 0
  MarkRetry = TRUE
  HitReply = "wait"
  Refusal = "none"
  RecvOrder = "fifo"
  LeaseWindow = TRUE
SYMMETRY Sym
SPECIFICATION Spec
INVARIANT Serializable NoUnseenConflict KeyCausal
INVARIANT RepliesDurable IdemOnce OneOutcome
