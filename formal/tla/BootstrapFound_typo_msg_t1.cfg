\* Fix candidate: cluster id at INITIALIZE, in every controller message; a node with an id drops other ids. (MaxTerm 1, 1 message in flight)
CONSTANTS
  Scenario = "typo"
  Guard = "seedset"
  IdMode = "msg"
  PledgeExpiry = FALSE
  MaxTerm = 1
  MaxCrashes = 1
  MaxWipes = 0
  MaxReconf = 1
  MaxMsgs = 1
  DataMsgs = FALSE
SPECIFICATION Spec
CONSTRAINT Bound
INVARIANT OneCluster NoMix NoCross
