\* Postgres SERIALIZABLE (ideal certifier) instead of OCC, one PG node,
\* 3 requests. Atomicity: Q at V = Q just before the mutation in every
\* serial order consistent with the committed dependency graph.
CONSTANTS
  Txns = {t1, t2, t3}
  NN = 2
  Actors = {u1}
  MaxFirst = 1
  IndexGhosts = TRUE
  GhostEdges = TRUE
  EdgeSetDot = TRUE
  Visit = "all"
  PolicyInputs = "edge"
  PolicyDots = "all"
  EntryDots = "field+lifecycle"
  Walk = "toStop"
  PolicyTracked = TRUE
  StaleSnapshot = FALSE
  GuardWrites = TRUE
  CC = "ssi"
  MultiPart = FALSE
  ValidateRemote = TRUE
  ReadSetRanges = TRUE
SYMMETRY Sym
SPECIFICATION Spec
INVARIANT TypeOK Soundness Atomicity
