  Txns = {t1, t2}
  NN = 2
  Actors = {u1}
  MaxFirst = 1
  IndexGhosts = TRUE
  GhostEdges = TRUE
  EdgeSetDot = TRUE
  Visit = "all"
  PolicyInputs = "edge"
  PolicyDots = "all"
  EntryDots = "field+lifecycle"
  Walk = "toStop"
  PolicyTracked = TRUE
  StaleSnapshot = FALSE
  GuardWrites = TRUE
  CC = "occ"
  MultiPart = TRUE
  ValidateRemote = FALSE
  ReadSetRanges = TRUE
SYMMETRY Sym
SPECIFICATION Spec
INVARIANT AtomicityOCC
