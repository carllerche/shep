\* EXPECTED TO FAIL (W3): the design as written. A retry through another
\* front end re-executes; when its `require` fails at its S (the original
\* committed and changed what it guards), the front end returns the failure
\* itself, and the anchor never sees the key.
CONSTANTS
  Servers = {s1, s2, s3}
  Prog <- ProgGuard1
  MaxTerm = 2
  MaxLen = 4
  MaxExec = 2
  MaxWin = 0
  MaxIWin = 0
  MaxExpire = 0
  Fence = TRUE
  TableAt = "append"
  Rebuild = TRUE
  IdemAt = "append"
  CheckRanges = TRUE
  CheckTooOld = TRUE
  Truncation = FALSE
  TruncFix = FALSE
  FailMode = "local"
SYMMETRY Sym
SPECIFICATION Spec
INVARIANT Serializable NoUnseenConflict KeyCausal
INVARIANT RepliesDurable IdemOnce OneOutcome
