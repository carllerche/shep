  Scenario = "typo"
  Guard = "seedset"
  IdMode = "msg"
  PledgeExpiry = FALSE
  MaxTerm = 2
  MaxCrashes = 1
  MaxWipes = 0
  MaxReconf = 1
  MaxMsgs = 3
  DataMsgs = FALSE
SPECIFICATION Spec
CONSTRAINT Bound
INVARIANT OneCluster NoMix NoCross
