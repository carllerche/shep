\* PASS: the W3 fast path. A failure goes through the anchor only for an
\* attempt that carries the client's retry mark; a first attempt returns its
\* failure directly, and a client that has retried no longer takes it.
\* Attempts begin and run separately, so a client can time out on front end A
\* and retry at B (marked) while A's attempt is still in flight. Bounds of
\* WalValidate_fail.cfg.
CONSTANTS
  Servers = {s1, s2, s3}
  Prog <- ProgGuard1
  MaxTerm = 2
  MaxLen = 4
  MaxExec = 2
  MaxWin = 0
  MaxIWin = 0
  MaxExpire = 0
  Fence = TRUE
  TableAt = "append"
  Rebuild = TRUE
  IdemAt = "append"
  CheckRanges = TRUE
  CheckTooOld = TRUE
  Truncation = FALSE
  TruncFix = FALSE
  FailMode = "fast"
  Split = FALSE
  VoidRule = FALSE
  Durability = "sync"
  MaxCrash = 0
  MarkRetry = TRUE
  HitReply = "wait"
  Refusal = "none"
  RecvOrder = "fifo"
  LeaseWindow = TRUE
SYMMETRY Sym
SPECIFICATION Spec
INVARIANT TypeOK ElectionSafety LogSafety LeaderCompleteness
INVARIANT Serializable NoUnseenConflict TooOldEnforced TablesComplete
INVARIANT RepliesDurable KeyCausal IdemOnce OneOutcome VoidNeverFires
PROPERTY DeposedCommitsNothing
