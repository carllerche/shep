\* EXPECTED TO FAIL (ReadersProgress): the drop guard does not clear the flag
\* on the error path. Every later reader sees the flag, waits for the lock
\* (free), restarts, and sees it again, forever.
CONSTANTS
  MaxAppend = 3
  MaxTerm = 2
  SegSize = 2
  MaxCrash = 0
  MaxStop = 0
  MaxSnap = 0
  MaxPrefix = 1
  SegDirSync = TRUE
  ClearMarker = TRUE
  SyncAfterTrunc = TRUE
  PersistStartFirst = TRUE
  SnapTmpSync = TRUE
  SnapDirSync = TRUE
  Rescan = TRUE
  RepairSync = TRUE
  ReopenAfterOpen = FALSE
  Gaps = "cut"
  Readers = {r1, r2}
  MaxReads = 1
  TruncFlag = "atomic"
  ErrorPath = "keep"
  MaxErr = 1
SPECIFICATION LiveSpec
INVARIANT ReadsConsistent NoSpuriousShort ReadsCorrect
PROPERTY ReadersProgress
