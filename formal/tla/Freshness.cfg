\* The rule as designed, on one partition with OCC at the sequencer: ghosts,
\* every visited row, policy inputs, every policy head, field and lifecycle
\* dots, walk to Q's stopping point. 3 requests, 2 nodes, 1 actor, max_first = 1.
CONSTANTS
  Txns = {t1, t2, t3}
  NN = 2
  Actors = {u1}
  MaxFirst = 1
  IndexGhosts = TRUE
  GhostEdges = TRUE
  EdgeSetDot = TRUE
  Visit = "all"
  PolicyInputs = "edge"
  PolicyDots = "all"
  EntryDots = "field+lifecycle"
  Walk = "toStop"
  PolicyTracked = TRUE
  StaleSnapshot = FALSE
  GuardWrites = TRUE
  CC = "occ"
  MultiPart = FALSE
  ValidateRemote = TRUE
  ReadSetRanges = TRUE
SYMMETRY Sym
SPECIFICATION Spec
INVARIANT TypeOK Soundness AtomicityOCC
