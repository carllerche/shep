\* Focus: the auth service revokes (stops issuing tokens); Shep honors the token until exp, links carry the minting token's exp, streams refresh at reauth, and writes are capped at exp. Outputs stop within TokLife + ExpSkew + Eps of the revocation. Expected to pass.
CONSTANTS
  Eps = 1
  B = 3
  PL = 2
  LeaseLen = 2
  MaxT = 8
  FocusSet = {"token"}
  Failovers = 1
  Ops = {"read", "mut", "topic", "link"}
  HorizonParts = {"meta", "act", "viewer"}
  AgeDrift = TRUE
  HbLease = TRUE
  MatCheck = "version"
  TopicGate = "horizon"
  DecideCheck = "fresh"
  InFlightDelay = TRUE
  Deadline = TRUE
  PresignMargin = 2
  ViewerDeleteDenies = TRUE
  TokLife = 3
  ExpSkew = 1
  ExpCap = TRUE
  SplitFix = TRUE
  FollowerStamp = "relay"
  RestartZombie = FALSE
SPECIFICATION Spec
INVARIANT Inv_Horizon Inv_Revoke Inv_FailClosed Inv_MaterializerLag Inv_LinkRevoked TypeOK
