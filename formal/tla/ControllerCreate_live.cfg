\* Convergence of the create-only reconciler under fairness, with a leader
\* change and a crash: every assigned replica exists and every group is
\* initialized. Expected to pass.
\* Bounds: log sets of one partition, ids 1..2, at most 3 controller commands
\* (MaxId = 2 keeps the node-by-id replica states small; with 2-partition sets
\* and ids 1..4 the state space passes 185M states).
CONSTANTS
  w1 = w1
  Nodes = {1, 2, 3}
  Managed = {1, 2}
  Names = {"a", "b", "not a domain"}
  DomainNames = {"a", "b"}
  MaxPartitions = 2
  Counts = {1}
  MaxId = 2
  Writes = {}
  MaxTerm = 2
  VoidRule = TRUE
  ReCheck = TRUE
  ManualAnywhere = FALSE
  Crashes = 1
  MaxLog = 3
SPECIFICATION LiveSpec
PROPERTY Convergence
