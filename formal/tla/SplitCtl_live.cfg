\* Liveness of the fixed protocol under fairness (C2's handoff is not fair:
\* its node may stay down): front ends make progress, the drain terminates, T
\* finishes, and the handoff to C1 resumes after P's leader crashes.
\* Expected to pass.
CONSTANTS
  ReqKey <- RK1
  With2PC = TRUE
  RouteBy = "entry"
  HandoffResume = TRUE
  CancelRule = "parent"
  RemoveOnStart = FALSE
  ChildEarly = FALSE
  IdemInstall = TRUE
  TooOld = TRUE
  DrainGuard = TRUE
  LostReplies = FALSE
  FreshReads = TRUE
  Crashes = 1
  MaxLen = 5
SPECIFICATION LiveSpec
CONSTRAINT Bound
PROPERTY FEProgress DrainTerminates TFinishes HandoffC1
