\* The design, two splits in a row: P -> C1 -> D1 (a grandchild), with
\* checkpoint clones and compaction at every generation; two writes of k1.
\* Expected to pass. (With lost replies and the registry change as well,
\* this exceeds 1.5M states; Split_resplit_reg covers the registry.)
CONSTANTS
  ReqKey <- RK11
  With2PC = FALSE
  THome = "P"
  WithDup = FALSE
  WithReg = FALSE
  Resplit = TRUE
  DrainGuard = TRUE
  FirstCtx = "parent"
  MovedCheck = TRUE
  ReleaseCtx = "decision"
  HandIdem = TRUE
  HandDecisions = TRUE
  HandReleased = TRUE
  ForgetRule = "deadline"
  Redeliver = TRUE
  FoldMode = "covered"
  KeyOrder = "lineage"
  ParentPad = 0
  Compaction = TRUE
  LostReplies = FALSE
  AllowCancel = FALSE
  MaxLen = 5
SPECIFICATION Spec
CONSTRAINT Bound
INVARIANT TypeOK NoLostAck Inv_OneCommitPerKey NoCommitAfterSplit ChildrenAfterSplit NoMisplacedCommit OneWriterPerKey BarrierCtx BarrierAcked LineageConsistent FoldExact FoldMonotone PhysicalWinner
