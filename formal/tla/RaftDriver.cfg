\* PASS. The landed driver (Driver = "landed"): replication sessions with
\* in-order results, the follower session gate with gap timeouts, full
\* heartbeats outside the session order, connection failure on restart, and
\* openraft for what has not landed: replies after flush, the leader counting
\* its flushed index, own-term commit clamped to the leader flushed index.
\* Leader restore off: a restarted leader comes back a follower. Elections
\* are atomic (a refused vote, sticky or by lease, is a lost vote request).
\* 3 replicas, one leader change (terms <= 2), one client entry, window 2,
\* one crash of any replica, any reordering, up to 2 drops and 1 duplicate,
\* gap timeouts at any time, at most 5 messages sent.
CONSTANTS
  Servers = {s1, s2, s3}
  Nil = Nil
  Driver = "landed"
  MaxTerm = 2
  MaxClient = 1
  Budget = 5
  Window = 2
  MaxSess = 3
  UseSeq = FALSE
  MaxSeq = 0
  MaxBuf = 2
  MaxSlots = 1
  MaxCrash = 1
  MaxDrop = 2
  MaxDup = 1
  MaxFault = 0
  MaxXfer = 0
  MaxEnv = 0
  FreeNet = FALSE
  FreeTime = TRUE
  AtomicElect = TRUE
  Prevote = TRUE
  XferException = TRUE
  ReplyAfterFlush = TRUE
  LeaderSelf = "flushed"
  LeaderClamp = TRUE
  FollowerClamp = TRUE
  LeaderRestore = FALSE
  HbLeaseRule = FALSE
  CtrReset = FALSE
  SeqCheck = "none"
  SessionCheck = TRUE
  AckRule = "permatch"
  LwHb = TRUE
  SlotRelease = TRUE
SYMMETRY Sym
SPECIFICATION Spec
CONSTRAINT SentBound
INVARIANT Safety
