\* EXPECTED TO FAIL (QuorumKept): old replicas are deleted when the move
\* command is applied, not at finish; the joint configuration loses the old
\* half's quorum.
CONSTANTS
  n1 = n1
  n2 = n2
  w1 = w1
  Nodes = {n1, n2}
  Writes = {w1}
  MaxCmds = 3
  WithSplit = FALSE
  WithRecreate = FALSE
  CancelMode = "back"
  DeleteOnMove = TRUE
  CancelAfterFinish = FALSE
  RevCheck = TRUE
  RaftRevCheck = TRUE
SPECIFICATION Spec
CONSTRAINT CmdBound
SYMMETRY Sym
INVARIANT TypeOK QuorumKept NoLostAck CancelRestores NoConfusion
