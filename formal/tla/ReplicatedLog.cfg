\* PASS. The contract as landed, occ embedder (PartitionSm-like: validation
\* against leader-side slots, refusing rv below the floor). Void on every
\* replica; lead() drops state; replay covers every non-void entry above the
\* floor, committed or not; retries wait (Waiting / AtIndex); FloorMode "any":
\* every floor the library could pick between the log start and the applied
\* index. 3 replicas, terms <= 2, logs <= 4, two requests (keys) on one object.
\* Void entries (terms 3), snapshots, restarts, lease lapses, oversize and
\* clocks are in the cfgs below.
CONSTANTS
  Servers = {s1, s2, s3}
  Prog <- ProgTwo
  MaxSends = 1
  Emb = "occ"
  MaxTerm = 2
  MaxLen = 4
  MaxTime = 0
  Ticks = FALSE
  W = 5
  AW = 0
  WinEntries = 9
  FloorMode = "any"
  FloorRule = TRUE
  PendingRule = "block"
  Evict = FALSE
  VoidRule = "all"
  Seed = "fix"
  MctVoid = TRUE
  LeadDrop = TRUE
  ReplayUncommitted = TRUE
  ReplayVoid = FALSE
  DiscardNA = FALSE
  ResolveTwice = FALSE
  WaitInFlight = TRUE
  SnapKeys = TRUE
  Snapshots = FALSE
  MaxCrash = 0
  LeaseToggle = FALSE
  Oversize = FALSE
  CtlId = "apply"
  CtlRecheck = TRUE
SYMMETRY Sym
SPECIFICATION Spec
INVARIANT Safety
