\* EXPECTED TO FAIL (CtlOnly): manual create allowed on controller-managed
\* nodes; a hand-made partition takes an id the controller later allocates.
CONSTANTS
  w1 = w1
  Nodes = {1, 2, 3}
  Managed = {1, 2}
  Names = {"a", "b", "not a domain"}
  DomainNames = {"a", "b"}
  MaxPartitions = 2
  Counts = {2}
  MaxId = 4
  Writes = {w1}
  MaxTerm = 2
  VoidRule = TRUE
  ReCheck = TRUE
  ManualAnywhere = TRUE
  Crashes = 1
  MaxLog = 3
SPECIFICATION Spec
INVARIANT TypeOK VoidNoEffect RulesHold Disjoint CtlOnly NoInheritedData OneInit
