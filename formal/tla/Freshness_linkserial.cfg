\* EXPECTED TO FAIL (sanity): under OCC the edge-set dot is a blind write, so
\* two links through one source still commit concurrently.
CONSTANTS
  Txns = {t1, t2}
  NN = 2
  Actors = {u1, u2}
  MaxFirst = 1
  IndexGhosts = TRUE
  GhostEdges = TRUE
  EdgeSetDot = TRUE
  Visit = "all"
  PolicyInputs = "edge"
  PolicyDots = "all"
  EntryDots = "field+lifecycle"
  Walk = "toStop"
  PolicyTracked = TRUE
  StaleSnapshot = FALSE
  GuardWrites = TRUE
  CC = "occ"
  MultiPart = FALSE
  ValidateRemote = TRUE
  ReadSetRanges = TRUE
SYMMETRY Sym
SPECIFICATION Spec
INVARIANT NoConcurrentLinksOnOneSource
