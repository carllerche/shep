\* The design (doc version 30) with the proposed fixes: drain guard, first
\* entries with context {P: i} and the full handoff, moved after the split
\* entry, releases whose context names the decision, decisions forgotten only
\* after the deadline, barrier re-delivery, (gen, pos) order, tokens fold only
\* when they cover the parent up to i. One split; one write of k1; T homed at
\* P with H; a late duplicate prepare; the registry change. Expected to pass.
CONSTANTS
  ReqKey <- RK1
  With2PC = TRUE
  THome = "P"
  WithDup = TRUE
  WithReg = TRUE
  Resplit = FALSE
  DrainGuard = TRUE
  FirstCtx = "parent"
  MovedCheck = TRUE
  ReleaseCtx = "decision"
  HandIdem = TRUE
  HandDecisions = TRUE
  HandReleased = TRUE
  ForgetRule = "deadline"
  Redeliver = TRUE
  FoldMode = "covered"
  KeyOrder = "lineage"
  ParentPad = 0
  Compaction = FALSE
  LostReplies = FALSE
  AllowCancel = FALSE
  MaxLen = 6
SPECIFICATION Spec
CONSTRAINT Bound
INVARIANT TypeOK NoLostAck Inv_OneCommitPerKey NoCommitAfterSplit ChildrenAfterSplit NoMisplacedCommit OneWriterPerKey BarrierCtx BarrierAcked LineageConsistent FoldExact FoldMonotone PhysicalWinner
