\* The design with every fix on (proposal and decision deadlines, the materializer's version check, presign margin, writes capped at the token's exp, retired-parent evidence ignored after a split, follower fetches relaying the leader's stamp, an RF = 1 restart with no lease wait): Shep's own revocations (policy deploys, deleting the actor or viewer, channel removal) take effect within B; a deleted viewer is denied even under an app-only allow; a token revoked at the auth service stops working within TokLife + ExpSkew + Eps. Expected to pass.
