\* PASS. The Redpanda target (Driver = "redpanda") with the fixes: replies
\* tagged with their request term (SessionCheck), the strict reorder check,
\* and commit from each success reply min(dirty, flushed) (AckRule
\* "permatch"). Group flush, lightweight heartbeats, follower-admitted
\* recovery with may_recover, recovery appends that skip the flush.
CONSTANTS
  Servers = {s1, s2, s3}
  Nil = Nil
  Driver = "redpanda"
  MaxTerm = 2
  MaxClient = 1
  Budget = 5
  Window = 2
  MaxSess = 2
  UseSeq = TRUE
  MaxSeq = 3
  MaxBuf = 2
  MaxSlots = 1
  MaxCrash = 1
  MaxDrop = 0
  MaxDup = 0
  MaxFault = 0
  MaxXfer = 0
  MaxEnv = 0
  FreeNet = TRUE
  FreeTime = TRUE
  AtomicElect = TRUE
  Prevote = TRUE
  XferException = TRUE
  ReplyAfterFlush = TRUE
  LeaderSelf = "flushed"
  LeaderClamp = TRUE
  FollowerClamp = TRUE
  LeaderRestore = FALSE
  HbLeaseRule = FALSE
  CtrReset = FALSE
  SeqCheck = "strict"
  SessionCheck = TRUE
  AckRule = "permatch"
  LwHb = TRUE
  SlotRelease = TRUE
SYMMETRY Sym
SPECIFICATION Spec
CONSTRAINT SentBound
INVARIANT Safety
