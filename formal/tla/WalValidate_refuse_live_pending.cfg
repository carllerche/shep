\* EXPECTED TO FAIL (liveness): the old behaviour, a refused slot stays
\* Pending: the re-send hits its own never-appended slot forever.
CONSTANTS
  Servers = {s1, s2, s3}
  Prog <- ProgOne
  MaxTerm = 1
  MaxLen = 4
  MaxExec = 2
  MaxWin = 0
  MaxIWin = 0
  MaxExpire = 0
  Fence = TRUE
  TableAt = "append"
  Rebuild = TRUE
  IdemAt = "append"
  CheckRanges = TRUE
  CheckTooOld = TRUE
  Truncation = FALSE
  TruncFix = FALSE
  FailMode = "logged"
  Split = FALSE
  VoidRule = FALSE
  Durability = "sync"
  MaxCrash = 0
  MarkRetry = TRUE
  HitReply = "wait"
  Refusal = "stay_pending"
  RecvOrder = "fifo"
  LeaseWindow = TRUE
SPECIFICATION LiveSpec
PROPERTY EventuallyOutcome
