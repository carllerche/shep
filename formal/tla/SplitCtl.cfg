\* The controller-driven split with the review's fixes: moved carries the split
\* entry, any leader of P resumes the handoff, P's log decides a cancel, the
\* drain answers `splitting`, children install P's idempotency table before
\* accepting. Two writes of k1 with lost replies, T in flight, one crash of
\* P's leader. Expected to pass.
CONSTANTS
  ReqKey <- RK11
  With2PC = TRUE
  RouteBy = "entry"
  HandoffResume = TRUE
  CancelRule = "parent"
  RemoveOnStart = FALSE
  ChildEarly = FALSE
  IdemInstall = TRUE
  TooOld = TRUE
  DrainGuard = TRUE
  LostReplies = TRUE
  FreshReads = FALSE
  Crashes = 1
  MaxLen = 5
SPECIFICATION Spec
CONSTRAINT Bound
INVARIANT TypeOK NoLostAck Inv_OneCommitPerKey OneOwner NoOrphanedRange ValidationComplete NoStrandedPrepare
