\* Re-creating handles without a read (as _restore), checking only what is downloaded: expected to pass, because every use re-runs the access check and the restored expiry keeps its token's cap.
CONSTANTS
  Uploads = {u1}
  Files = {f1}
  NoF = NoF
  MaxRevoke = 0
  NeedsText = FALSE
  CopyReadCheck = TRUE
  CopyStoredCheck = TRUE
  DirectToBlob = FALSE
  CopyRecheckAtAttach = TRUE
  Resolver = "pull"
  DL = "restore"
SPECIFICATION Spec
INVARIANT DownloadRevokeBound DownloadTokenBound
