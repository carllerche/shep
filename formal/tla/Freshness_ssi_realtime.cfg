\* EXPECTED TO FAIL (informational): under Postgres SSI, `require unchanged`
\* holds at the serialization point, not at the wall-clock commit: a
\* concurrent writer that the mutation precedes (rw) may commit first.
CONSTANTS
  Txns = {t1, t2}
  NN = 2
  Actors = {u1}
  MaxFirst = 1
  IndexGhosts = TRUE
  GhostEdges = TRUE
  EdgeSetDot = TRUE
  Visit = "all"
  PolicyInputs = "edge"
  PolicyDots = "all"
  EntryDots = "field+lifecycle"
  Walk = "toStop"
  PolicyTracked = TRUE
  StaleSnapshot = FALSE
  GuardWrites = TRUE
  CC = "ssi"
  MultiPart = FALSE
  ValidateRemote = TRUE
  ReadSetRanges = TRUE
SYMMETRY Sym
SPECIFICATION Spec
INVARIANT AtomicityRealTime
