\* EXPECTED TO FAIL (LiveSessionNotStale). VIOLATES THE STATED ASSUMPTION
\* that a restart or core move forces a new term before a replica leads
\* again: the session counter goes back within a term, so the follower
\* rejects the live stream as stale until the counter passes the old value.
\* Consensus safety is unaffected (RaftDriver_ctrreset_safe).
