\* Pass. Leader-resolved decrements pipelined at the leader (dec1, dec2), an op
\* whose field another consumer reads (bump, compiled to a validated write), a
\* removal of the field (clear), a soft delete of the op's node (delI), and a
\* window floor that advances once per partition.
CONSTANTS
  Reqs = {"dec1", "dec2", "bump", "clear", "delI"}
  StockInit = 1
  CLive0 = TRUE
  MaxExec = 2
  MaxFloor = 1
  Change = "none"
  TwoStep = TRUE
  BarrierCheck = TRUE
  RelyRule = TRUE
  LifecycleRule = TRUE
  VisibleRule = TRUE
  Resolve = "window"
  PrevMode = "prev"
  OpReadRule = TRUE
  RetryFresh = TRUE
  RetryWhole = TRUE
SPECIFICATION Spec
INVARIANT TypeOK OutcomeSerializable FreshFalse CauseVisible DeltaOldExact CtxRule KeyOrder BoundNeverCrossed CompiledAsValidated DisciplinesHold RelyNeedsBarrier WeakenAfterAck ReadHorizon
