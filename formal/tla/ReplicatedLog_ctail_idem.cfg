\* FAIL (IdemOnce). Tail-only seeding: a key forgotten by an entry whose commit
\* time the new leader didn't seed from is decided again within W of its first
\* decision's commit time. Clocks advance 0..2.
CONSTANTS
  Servers = {s1, s2, s3}
  Prog <- ProgTwo
  MaxSends = 1
  Emb = "occ"
  MaxTerm = 2
  MaxLen = 5
  MaxTime = 2
  Ticks = TRUE
  W = 1
  AW = 0
  WinEntries = 1
  FloorMode = "impl"
  FloorRule = TRUE
  PendingRule = "block"
  Evict = FALSE
  VoidRule = "all"
  Seed = "tail"
  MctVoid = TRUE
  LeadDrop = TRUE
  ReplayUncommitted = TRUE
  ReplayVoid = FALSE
  DiscardNA = FALSE
  ResolveTwice = FALSE
  WaitInFlight = TRUE
  SnapKeys = TRUE
  Snapshots = FALSE
  MaxCrash = 0
  LeaseToggle = FALSE
  Oversize = FALSE
  CtlId = "apply"
  CtlRecheck = TRUE
SYMMETRY Sym
SPECIFICATION Spec
INVARIANT IdemOnce
