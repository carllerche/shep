\* EXPECTED TO FAIL (W10): LogEntryDiscarded treated as NotAppended. A
\* leader's entry is truncated after it steps down; it is re-elected, and the
\* late notification drops what its rebuilt table holds at that index, now a
\* different entry. (NASound is violated at once; this cfg shows the effect.
\* No lease window here, to keep the trace short.)
CONSTANTS
  Servers = {s1, s2, s3}
  Prog <- ProgDiscard
  MaxTerm = 3
  MaxLen = 4
  MaxExec = 2
  MaxWin = 0
  MaxIWin = 0
  MaxExpire = 0
  Fence = TRUE
  TableAt = "append"
  Rebuild = TRUE
  IdemAt = "append"
  CheckRanges = TRUE
  CheckTooOld = TRUE
  Truncation = FALSE
  TruncFix = FALSE
  FailMode = "logged"
  Split = FALSE
  VoidRule = FALSE
  Durability = "sync"
  MaxCrash = 0
  MarkRetry = TRUE
  HitReply = "wait"
  Refusal = "discard_na"
  RecvOrder = "fifo"
  LeaseWindow = FALSE
SYMMETRY Sym
SPECIFICATION Spec
INVARIANT Serializable NoUnseenConflict KeyCausal
INVARIANT RepliesDurable IdemOnce OneOutcome
