\* PASS. Focused on reply ordering (one leader change, one crash, no client
\* entries, no duplicates, up to 3 drops, any reordering, 11 messages), with
\* the fixed commit input: min(dirty, flushed) of each success reply.
CONSTANTS
  Servers = {s1, s2, s3}
  Nil = Nil
  Driver = "redpanda"
  MaxTerm = 2
  MaxClient = 0
  Budget = 11
  Window = 1
  MaxSess = 2
  UseSeq = TRUE
  MaxSeq = 4
  MaxBuf = 1
  MaxSlots = 1
  MaxCrash = 1
  MaxDrop = 3
  MaxDup = 0
  MaxFault = 0
  MaxXfer = 0
  MaxEnv = 0
  FreeNet = FALSE
  FreeTime = TRUE
  AtomicElect = TRUE
  Prevote = TRUE
  XferException = TRUE
  ReplyAfterFlush = TRUE
  LeaderSelf = "flushed"
  LeaderClamp = TRUE
  FollowerClamp = TRUE
  LeaderRestore = FALSE
  HbLeaseRule = FALSE
  CtrReset = FALSE
  SeqCheck = "strict"
  SessionCheck = TRUE
  AckRule = "permatch"
  LwHb = TRUE
  SlotRelease = TRUE
SYMMETRY Sym
SPECIFICATION Spec
CONSTRAINT SentBound
INVARIANT AckSound Consensus
