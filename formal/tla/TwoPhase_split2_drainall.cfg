\* EXPECTED TO FAIL (DrainTerminates): the draining parent rejects decisions
\* and releases as well as new prepares; a transaction prepared there before
\* the drain can never be released, so the drain never ends.
CONSTANTS
  NP = 2
  Attempts = {"A"}
  Crash = TRUE
  StampMode = "decision"
  CtxPrepDots = TRUE
  ReadOnlyParts = TRUE
  OnIntent = "reject"
  PartHomeView = "prepare"
  HomeRule = "anchor"
  MatLookahead = TRUE
  ForgetRule = "deadline"
  Deadline = TRUE
  Dup = FALSE
  Barriers = FALSE
  RegCheck = "decide"
  Split = FALSE
  SplitCarry = TRUE
  Outages = FALSE
  Split2 = TRUE
  DrainRule = "all"
  LookupRoute = "lowest"
  IdemTo = "anchor"
  IdemSnap = "split"
SPECIFICATION LiveSpec
PROPERTY DrainTerminates
