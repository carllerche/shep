\* EXPECTED TO FAIL (QuorumKept): raft configurations don't carry the
\* controller revision. A move is cancelled before raft acts; the cancelled
\* update finishes; a leader acting on its stale table then enters the joint
\* configuration, and the target node, no longer expected, deletes its replica.
CONSTANTS
  n1 = n1
  n2 = n2
  w1 = w1
  Nodes = {n1, n2}
  Writes = {w1}
  MaxCmds = 3
  WithSplit = TRUE
  WithRecreate = FALSE
  CancelMode = "back"
  DeleteOnMove = FALSE
  CancelAfterFinish = FALSE
  RevCheck = TRUE
  RaftRevCheck = FALSE
SPECIFICATION Spec
CONSTRAINT CmdBound
SYMMETRY Sym
INVARIANT TypeOK QuorumKept NoLostAck CancelRestores NoConfusion
