\* EXPECTED TO FAIL (IndexExact): backfill without a cutover. Backfill reads
\* whatever state is applied when it runs, while maintenance starts at the
\* barrier.
CONSTANTS
  ReqOf <- RQ2
  Changes = {"ix"}
  Barriers = TRUE
  BarrierRule = "max"
  Cutover = "none"
  EvalAtS = TRUE
  CheckRule = "barrier"
  MaxLen = 6
SPECIFICATION Spec
CONSTRAINT Bound
INVARIANT TypeOK BarrierCtx PolicyEnforced IndexExact ReplayEqual FreshnessSound
