\* EXPECTED TO FAIL (OneWriterPerKey): an intent release's context does not
\* name the decision dot, so the first context {P: i} misses the stamp of
\* T's write, and C1 validates a write that never saw it.
CONSTANTS
  ReqKey <- RK1
  With2PC = TRUE
  THome = "H"
  WithDup = FALSE
  WithReg = FALSE
  Resplit = FALSE
  DrainGuard = TRUE
  FirstCtx = "parent"
  MovedCheck = TRUE
  ReleaseCtx = "none"
  HandIdem = TRUE
  HandDecisions = TRUE
  HandReleased = TRUE
  ForgetRule = "deadline"
  Redeliver = TRUE
  FoldMode = "covered"
  KeyOrder = "lineage"
  ParentPad = 0
  Compaction = FALSE
  LostReplies = FALSE
  AllowCancel = FALSE
  MaxLen = 6
SPECIFICATION Spec
CONSTRAINT Bound
INVARIANT TypeOK NoLostAck Inv_OneCommitPerKey NoCommitAfterSplit ChildrenAfterSplit NoMisplacedCommit OneWriterPerKey BarrierCtx BarrierAcked LineageConsistent FoldExact FoldMonotone PhysicalWinner
