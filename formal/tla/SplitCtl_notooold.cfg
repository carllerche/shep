\* EXPECTED TO FAIL (ValidationComplete): a child accepts a proposal whose read
\* version predates the split entry; its empty validation table can't check it.
CONSTANTS
  ReqKey <- RK11
  With2PC = FALSE
  RouteBy = "entry"
  HandoffResume = TRUE
  CancelRule = "parent"
  RemoveOnStart = FALSE
  ChildEarly = FALSE
  IdemInstall = TRUE
  TooOld = FALSE
  DrainGuard = TRUE
  LostReplies = FALSE
  FreshReads = FALSE
  Crashes = 1
  MaxLen = 5
SPECIFICATION Spec
CONSTRAINT Bound
INVARIANT TypeOK NoLostAck Inv_OneCommitPerKey OneOwner NoOrphanedRange ValidationComplete NoStrandedPrepare
