  B = 3
  PL = 2
  LeaseLen = 2
  MaxT = 8
  FocusSet = {"restart"}
  Failovers = 1
  Ops = {"read", "mut", "topic", "link"}
  HorizonParts = {"meta", "act", "viewer"}
  AgeDrift = TRUE
  HbLease = TRUE
  MatCheck = "version"
  TopicGate = "horizon"
  DecideCheck = "fresh"
  InFlightDelay = TRUE
  Deadline = TRUE
  PresignMargin = 2
  ViewerDeleteDenies = TRUE
  TokLife = 3
  ExpSkew = 1
  ExpCap = TRUE
  SplitFix = TRUE
  FollowerStamp = "relay"
  RestartZombie = FALSE
SPECIFICATION Spec
INVARIANT Inv_Horizon Inv_Revoke Inv_FailClosed Inv_MaterializerLag Inv_LinkRevoked TypeOK
