\* Two partitions (node n on partition n, policy heads on partition 1);
\* validation covers every partition the read set touches.
CONSTANTS
  Txns = {t1, t2, t3}
  NN = 2
  Actors = {u1}
  MaxFirst = 1
  IndexGhosts = TRUE
  GhostEdges = TRUE
  EdgeSetDot = TRUE
  Visit = "all"
  PolicyInputs = "edge"
  PolicyDots = "all"
  EntryDots = "field+lifecycle"
  Walk = "toStop"
  PolicyTracked = TRUE
  StaleSnapshot = FALSE
  GuardWrites = TRUE
  CC = "occ"
  MultiPart = TRUE
  ValidateRemote = TRUE
  ReadSetRanges = TRUE
SYMMETRY Sym
SPECIFICATION Spec
INVARIANT TypeOK Soundness AtomicityOCC
