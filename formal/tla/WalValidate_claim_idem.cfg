\* EXPECTED TO FAIL: claims with a committed-only idempotency check: a claim
\* retried through another front end while the original is appended claims a
\* second task under the same key.
CONSTANTS
  Servers = {s1, s2, s3}
  Prog <- ProgClaim
  MaxTerm = 1
  MaxLen = 5
  MaxExec = 2
  MaxWin = 0
  MaxIWin = 0
  MaxExpire = 0
  Fence = TRUE
  TableAt = "append"
  Rebuild = TRUE
  IdemAt = "commit"
  CheckRanges = TRUE
  CheckTooOld = TRUE
  Truncation = FALSE
  TruncFix = FALSE
  FailMode = "logged"
SYMMETRY Sym
SPECIFICATION Spec
INVARIANT Serializable NoUnseenConflict KeyCausal
INVARIANT RepliesDurable IdemOnce OneOutcome
INVARIANT FenceHolds NoDoubleLease CompletedByHolder
