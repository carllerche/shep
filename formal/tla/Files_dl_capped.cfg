\* Downloads with reauth capped at the handle's original lifetime: min(new exp, minting clock + 1 h). Expected to pass, including the one-hour bearer bound.
CONSTANTS
  Uploads = {u1}
  Files = {f1}
  NoF = NoF
  MaxRevoke = 0
  NeedsText = FALSE
  CopyReadCheck = TRUE
  CopyStoredCheck = TRUE
  DirectToBlob = FALSE
  CopyRecheckAtAttach = TRUE
  Resolver = "pull"
  DL = "capped"
SPECIFICATION Spec
INVARIANT DownloadRevokeBound DownloadTokenBound RemintNoWiden LinkBearerHour
