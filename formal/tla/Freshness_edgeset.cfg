\* Passes: policy inputs tested by the source's edge-set dot instead of the
\* edge row, with unlink deleting the edge row (the edge-set dot alone suffices).
CONSTANTS
  Txns = {t1, t2, t3}
  NN = 2
  Actors = {u1}
  MaxFirst = 1
  IndexGhosts = TRUE
  GhostEdges = FALSE
  EdgeSetDot = TRUE
  Visit = "all"
  PolicyInputs = "edgeset"
  PolicyDots = "all"
  EntryDots = "field+lifecycle"
  Walk = "toStop"
  PolicyTracked = TRUE
  StaleSnapshot = FALSE
  GuardWrites = TRUE
  CC = "occ"
  MultiPart = FALSE
  ValidateRemote = TRUE
  ReadSetRanges = TRUE
SYMMETRY Sym
SPECIFICATION Spec
INVARIANT TypeOK Soundness AtomicityOCC
