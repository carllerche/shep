\* EXPECTED TO FAIL (BarrierAcked): a barrier sent to P after its split
\* entry is not delivered again to the children; a stale front end commits
\* in C1 after the deploy is acknowledged.
CONSTANTS
  ReqKey <- RK1
  With2PC = FALSE
  THome = "P"
  WithDup = FALSE
  WithReg = TRUE
  Resplit = FALSE
  DrainGuard = TRUE
  FirstCtx = "parent"
  MovedCheck = TRUE
  ReleaseCtx = "decision"
  HandIdem = TRUE
  HandDecisions = TRUE
  HandReleased = TRUE
  ForgetRule = "deadline"
  Redeliver = FALSE
  FoldMode = "covered"
  KeyOrder = "lineage"
  ParentPad = 0
  Compaction = FALSE
  LostReplies = FALSE
  AllowCancel = FALSE
  MaxLen = 6
SPECIFICATION Spec
CONSTRAINT Bound
INVARIANT TypeOK NoLostAck Inv_OneCommitPerKey NoCommitAfterSplit ChildrenAfterSplit NoMisplacedCommit OneWriterPerKey BarrierCtx BarrierAcked LineageConsistent FoldExact FoldMonotone PhysicalWinner
