\* Liveness of the design with the split (one attempt; the retry adds nothing to
\* the drain): every prepare is released, every transaction is decided or
\* expires, and a drain that starts ends in the split. Expected to pass.
CONSTANTS
  NP = 2
  Attempts = {"A"}
  Crash = TRUE
  StampMode = "decision"
  CtxPrepDots = TRUE
  ReadOnlyParts = TRUE
  OnIntent = "reject"
  PartHomeView = "prepare"
  HomeRule = "anchor"
  MatLookahead = TRUE
  ForgetRule = "deadline"
  Deadline = TRUE
  Dup = FALSE
  Barriers = FALSE
  RegCheck = "decide"
  Split = FALSE
  SplitCarry = TRUE
  Outages = FALSE
  Split2 = TRUE
  DrainRule = "reject"
  LookupRoute = "lowest"
  IdemTo = "anchor"
  IdemSnap = "split"
SPECIFICATION LiveSpec
PROPERTY IntentsReleased EventuallyDecided DrainTerminates
