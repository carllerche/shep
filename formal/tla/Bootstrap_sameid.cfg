\* EXPECTED TO FAIL (CommittedKept): a re-imaged member rejoins under its old identity (its address) with an empty log, and its vote elects a leader that lacks a committed entry.
CONSTANTS
  Nodes = {"a", "b", "c", "x"}
  ProdSeeds = {"a", "b", "c"}
  NpSeeds = {"x"}
  NpNodes = {"x"}
  AllEmpty = TRUE
  Guard = "claim"
  UuidCheck = TRUE
  EnvCheck = TRUE
  Rejoin = "same"
  SecondAs = "learner"
  PromoteCheck = TRUE
  AddGuard = TRUE
  Repurpose = FALSE
  MaxWipes = 1
  MaxCrashes = 1
  MaxLog = 4
  MaxClusters = 3
SPECIFICATION Spec
INVARIANT OneClusterPerSeeds NoNodeInTwoClusters ProdNpNeverMix GrowthKeepsQuorum CommittedKept
