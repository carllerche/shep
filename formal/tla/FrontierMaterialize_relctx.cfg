\* EXPECTED TO FAIL (ReadExact): a release entry has no context, and
\* compaction by log position drops a version that a pinned read at or above
\* the floor still needs: the newer version at the release's position is
\* stamped with a decision dot that the read's version doesn't contain.
CONSTANTS
  Parts = {"A", "B"}
  Home = "A"
  Part2 = "B"
  HasTxn = TRUE
  ReplPart = "none"
  MaxW = 2
  MaxCrash = 0
  MaxReads = 1
  FP = {"B"}
  CtxClosed = TRUE
  ReleaseCtx = FALSE
  FrontierMode = "close"
  RestartMode = "batch"
  FloorMode = "pins"
  ReaderMode = "fix"
  InDoubt = TRUE
  EnableFrontier = FALSE
  EnableView = FALSE
  EnableReader = TRUE
  EnableRetention = TRUE
  ReadFrontier = FALSE
SPECIFICATION Spec
INVARIANT ReadExact
