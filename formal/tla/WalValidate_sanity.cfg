\* EXPECTED TO FAIL, every invariant: reachability checks. Run with -continue,
\* or one invariant at a time (-continue reports only the first invariant a
\* state violates, so a later one can be masked).
\* Each Never* invariant negates a scenario the passing configs rely on being
\* reachable (extras in S, a deposed leader appending, an overwritten entry,
\* an earlier term's mutation committed by a later leader, a proposal below
\* the window, a retry answered from the idempotency table).
CONSTANTS
  Servers = {s1, s2, s3}
  Prog <- ProgTerms
  MaxTerm = 3
  MaxLen = 4
  MaxExec = 2
  MaxWin = 1
  MaxIWin = 0
  MaxExpire = 0
  Fence = TRUE
  TableAt = "append"
  Rebuild = TRUE
  IdemAt = "append"
  CheckRanges = TRUE
  CheckTooOld = TRUE
  Truncation = FALSE
  TruncFix = FALSE
  FailMode = "logged"
  Split = FALSE
  VoidRule = FALSE
  Durability = "sync"
  MaxCrash = 0
  MarkRetry = TRUE
  HitReply = "wait"
  Refusal = "none"
  RecvOrder = "fifo"
  LeaseWindow = TRUE
SYMMETRY Sym
SPECIFICATION Spec
INVARIANT NeverExtras NeverOldTermCommittedLater NeverOverwritten
INVARIANT NeverDeposedAppend NeverBelowWindow NeverRetryAnswered
