\* Liveness, every proposed fix on: closure terminates, at_least reads
\* return, every committed dot reaches the frontier and the view. Expected
\* to pass. Small bounds (one write, one 2PC, one crash, no retention),
\* fairness on applies, publishes, the 2PC, and the reader's steps.
CONSTANTS
  Parts = {"A", "B"}
  Home = "A"
  Part2 = "B"
  HasTxn = TRUE
  ReplPart = "none"
  MaxW = 1
  MaxCrash = 1
  MaxReads = 1
  FP = {"B"}
  CtxClosed = TRUE
  ReleaseCtx = TRUE
  FrontierMode = "close"
  RestartMode = "batch"
  FloorMode = "pins"
  ReaderMode = "fix"
  InDoubt = TRUE
  EnableFrontier = TRUE
  EnableView = TRUE
  EnableReader = TRUE
  EnableRetention = FALSE
  ReadFrontier = FALSE
SPECIFICATION FairSpec
INVARIANT ReadExact FrontierClosed ViewExact
PROPERTY ClosureTerminates AtLeastTerminates FrontierLive ViewLive
