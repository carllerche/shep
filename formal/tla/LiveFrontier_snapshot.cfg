  MaxEntries = 3
  MaxA = 3
  MaxB = 0
  MaxMsgs = 2
  MaxCrashes = 0
  OpsA = {"post"}
  OpsB = {}
  Deps = FALSE
  Subs = {"u2"}
  Window = FALSE
  StepTo = "frontier"
  JoinMode = "snapshot"
  ReRegister = TRUE
  JoinWait = TRUE
  DenyDeletedViewer = TRUE
  LookupByViewerOnly = FALSE
  TopicStart = "latest"
SPECIFICATION Spec
INVARIANT TypeOK Monotone PushExact
