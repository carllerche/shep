\* Liveness, the design: a coordinator that crashes at any point. Intents are
\* released, every prepared transaction is decided or expires, and every
\* decision record is eventually forgotten. Expected to pass.
CONSTANTS
  NP = 2
  Attempts = {"A", "MY"}
  Crash = TRUE
  StampMode = "decision"
  CtxPrepDots = TRUE
  ReadOnlyParts = TRUE
  OnIntent = "reject"
  PartHomeView = "prepare"
  HomeRule = "anchor"
  MatLookahead = TRUE
  ForgetRule = "deadline"
  Deadline = TRUE
  Dup = FALSE
  Barriers = FALSE
  RegCheck = "decide"
  Split = FALSE
  SplitCarry = TRUE
  Outages = FALSE
SPECIFICATION LiveSpec
PROPERTY IntentsReleased EventuallyDecided EventuallyForgotten
