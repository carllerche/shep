\* The design with the proposed fixes: lens switched at the DualWrite
\* registry dot; freshness checks and topics count the DualWrite, activation
\* and abandon dots; the new unique enforced over new-head images from the
\* Prepared barrier on; backfill reads at snapshots holding its partition's
\* barrier. 2 user writes, one split, a test base, the next version.
CONSTANTS
  MaxWrites = 2
  LensSwitch = "barrier"
  LensKey = "registry"
  CountDots = {"dual", "act", "abandon"}
  UniqueEnforce = "index"
  ActCheckUnique = TRUE
  ActCtx = TRUE
  BackfillValidate = TRUE
  BackfillSnap = "afterBarrier"
  Redeliver = TRUE
  CursorRemap = "remap"
  AbandonAfterBackfill = FALSE
  WritePolicy = "rejectLossy"
  BaseCheck = TRUE
  WithSplit = TRUE
  WithNext = TRUE
  WithBase = TRUE
SPECIFICATION Spec
INVARIANT TypeOK Inv_Shape Inv_DualWrite Inv_Lens Inv_ActivateGuard Inv_NoReturn Inv_One Inv_BarrierChild Inv_Cursor Inv_Base Inv_BaseAgree Inv_NoLostUpdate Inv_AbandonLossless Inv_SetFeasible Inv_BackfillQuiet
