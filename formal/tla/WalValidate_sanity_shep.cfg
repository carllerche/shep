\* EXPECTED TO FAIL, every invariant (one at a time; see
\* WalValidate_sanity.cfg): with atomic validate+append, a mutation appended
\* by an already-deposed leader is later committed by a leader of a higher
\* term whose rebuilt table holds it; and an uncommitted entry missing from
\* the newest leader's log is overwritten.
CONSTANTS
  Servers = {s1, s2, s3}
  Prog <- ProgSmall
  MaxTerm = 3
  MaxLen = 4
  MaxExec = 2
  MaxWin = 0
  MaxIWin = 0
  MaxExpire = 0
  Fence = TRUE
  TableAt = "append"
  Rebuild = TRUE
  IdemAt = "append"
  CheckRanges = TRUE
  CheckTooOld = TRUE
  Truncation = FALSE
  TruncFix = FALSE
  FailMode = "logged"
  Split = FALSE
  VoidRule = FALSE
  Durability = "sync"
  MaxCrash = 0
  MarkRetry = TRUE
  HitReply = "wait"
  Refusal = "none"
  RecvOrder = "fifo"
  LeaseWindow = TRUE
SYMMETRY Sym
SPECIFICATION Spec
INVARIANT NeverDeposedTxnCommitted NeverOverwritten
