\* EXPECTED TO FAIL: claims with write sets entered at commit (C1): two
\* workers claim the same task.
CONSTANTS
  Servers = {s1, s2, s3}
  Prog <- ProgClaim
  MaxTerm = 1
  MaxLen = 5
  MaxExec = 1
  MaxWin = 0
  MaxIWin = 0
  MaxExpire = 0
  Fence = TRUE
  TableAt = "commit"
  Rebuild = TRUE
  IdemAt = "append"
  CheckRanges = TRUE
  CheckTooOld = TRUE
  Truncation = FALSE
  TruncFix = FALSE
  FailMode = "logged"
  Split = FALSE
  VoidRule = FALSE
  Durability = "sync"
  MaxCrash = 0
  MarkRetry = TRUE
  HitReply = "wait"
  Refusal = "none"
  RecvOrder = "fifo"
  LeaseWindow = TRUE
SYMMETRY Sym
SPECIFICATION Spec
INVARIANT Serializable NoUnseenConflict KeyCausal
INVARIANT RepliesDurable IdemOnce OneOutcome
INVARIANT FenceHolds NoDoubleLease CompletedByHolder
