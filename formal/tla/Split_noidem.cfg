\* EXPECTED TO FAIL (Inv_OneCommitPerKey): the handoff lacks the parent's
\* idempotency window; a retry that spans the split commits twice.
CONSTANTS
  ReqKey <- RK1
  With2PC = FALSE
  THome = "P"
  WithDup = FALSE
  WithReg = FALSE
  Resplit = FALSE
  DrainGuard = TRUE
  FirstCtx = "parent"
  MovedCheck = TRUE
  ReleaseCtx = "decision"
  HandIdem = FALSE
  HandDecisions = TRUE
  HandReleased = TRUE
  ForgetRule = "deadline"
  Redeliver = TRUE
  FoldMode = "covered"
  KeyOrder = "lineage"
  ParentPad = 0
  Compaction = FALSE
  LostReplies = TRUE
  AllowCancel = FALSE
  MaxLen = 6
SPECIFICATION Spec
CONSTRAINT Bound
INVARIANT TypeOK NoLostAck Inv_OneCommitPerKey NoCommitAfterSplit ChildrenAfterSplit NoMisplacedCommit OneWriterPerKey BarrierCtx BarrierAcked LineageConsistent FoldExact FoldMonotone PhysicalWinner
