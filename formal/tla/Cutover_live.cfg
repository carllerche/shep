\* Liveness: under fairness and bounded contention (1 user write), backfill
\* completes and the cutover ends.
CONSTANTS
  MaxWrites = 1
  LensSwitch = "barrier"
  LensKey = "registry"
  CountDots = {"dual", "act", "abandon"}
  UniqueEnforce = "index"
  ActCheckUnique = TRUE
  ActCtx = TRUE
  BackfillValidate = TRUE
  BackfillSnap = "afterBarrier"
  Redeliver = TRUE
  CursorRemap = "remap"
  AbandonAfterBackfill = FALSE
  WritePolicy = "rejectLossy"
  BaseCheck = TRUE
  WithSplit = TRUE
  WithNext = FALSE
  WithBase = FALSE
SPECIFICATION FairSpec
INVARIANT TypeOK
PROPERTY Live_Backfill Live_Done
