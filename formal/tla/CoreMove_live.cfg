\* Liveness, refuse rule with one move: under weak fairness of every protocol
\* step (not of crashes, moves or Raft activity) a transfer ends, and the node
\* settles with one running replica and no leftover state, unless its last
\* startup refused. Expected to pass.
CONSTANTS
  MaxCores = 3
  CoreCounts = {1, 2, 3}
  InitCores = 3
  InitHomes = {0, 1, 2}
  RestartMode = "refuse"
  Cands = {"a", "b"}
  MaxTerm = 1
  MaxCfg = 0
  MaxLog = 1
  MaxCrashes = 2
  MaxMoves = 1
  LogPerCore = TRUE
  CopyLog = TRUE
  SkipShutdown = FALSE
  CopyEarly = FALSE
  CleanEarly = FALSE
  CleanupLog = FALSE
  MergeDropRecv = FALSE
  MergeRecvDone = FALSE
  ResumeLead = "none"
  Fold = "none"
SPECIFICATION LiveSpec
INVARIANT TypeOK NoTwoLive LiveIsHosted VoteSafety VoteNoRegress CfgNoRegress StartNoRegress LogNoRegress LeaderTermFresh NoGroupDropped PlacementConsistent
PROPERTY MoveEnds Settles
