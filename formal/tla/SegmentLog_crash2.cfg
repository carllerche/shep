\* PASS. As SegmentLog.cfg with 2 crashes, so a crash can hit the recovery
\* from a crash (idempotence): 2 entries, 1 clean shutdown, no background
\* snapshot or prefix truncation (startup still snapshots the kvstore).
CONSTANTS
  MaxAppend = 2
  MaxTerm = 2
  SegSize = 2
  MaxCrash = 2
  MaxStop = 1
  MaxSnap = 0
  MaxPrefix = 0
  SegDirSync = TRUE
  ClearMarker = TRUE
  SyncAfterTrunc = TRUE
  PersistStartFirst = TRUE
  SnapTmpSync = TRUE
  SnapDirSync = TRUE
  Rescan = TRUE
  RepairSync = TRUE
  ReopenAfterOpen = FALSE
  Gaps = "cut"
  Readers = {}
  MaxReads = 0
  TruncFlag = "atomic"
  ErrorPath = "none"
  MaxErr = 0
SPECIFICATION Spec
INVARIANT KvRecovers VoteNeverRegresses StartNeverRegresses NoReadIntoDeleted
INVARIANT FlushedSurvives RecoveredIsAppendedPrefix TruncatedNeverReappears
INVARIANT FilesPrefixRelated RunningLogMatches MetaMatchesFiles
