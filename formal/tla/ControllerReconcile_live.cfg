\* Convergence under fairness of reconcilers, raft and dispatch: every node
\* applies every command, replicas match the table, no update stays in
\* progress, a started split finishes. Expected to pass.
CONSTANTS
  n1 = n1
  n2 = n2
  w1 = w1
  Nodes = {n1, n2}
  Writes = {w1}
  MaxCmds = 2
  WithSplit = TRUE
  WithRecreate = FALSE
  CancelMode = "back"
  DeleteOnMove = FALSE
  CancelAfterFinish = FALSE
  RevCheck = TRUE
  RaftRevCheck = TRUE
SPECIFICATION LiveSpec
CONSTRAINT CmdBound
PROPERTY Convergence
