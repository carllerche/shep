\* EXPECTED TO FAIL (UploadingResolves): push resolver; an attach that read "pending" commits after complete (or expiry) already moved the files it could see. The file stays Uploading forever.
CONSTANTS
  Uploads = {u1}
  Files = {f1}
  NoF = NoF
  MaxRevoke = 0
  NeedsText = TRUE
  CopyReadCheck = TRUE
  CopyStoredCheck = TRUE
  DirectToBlob = FALSE
  CopyRecheckAtAttach = TRUE
  Resolver = "push"
SPECIFICATION LiveSpec
INVARIANT Safety
PROPERTY UploadingResolves ProcessingResolves
