\* FAIL (NotAppendedNeverWrites). An entry whose responder completes with
\* LogEntryDiscarded (purged by a snapshot install on its deposed leader) is
\* resolved NotAppended, though another leader committed it.
CONSTANTS
  Servers = {s1, s2, s3}
  Prog <- ProgOne
  MaxSends = 1
  Emb = "occ"
  MaxTerm = 2
  MaxLen = 3
  MaxTime = 0
  Ticks = FALSE
  W = 5
  AW = 0
  WinEntries = 9
  FloorMode = "any"
  FloorRule = TRUE
  PendingRule = "block"
  Evict = FALSE
  VoidRule = "all"
  Seed = "fix"
  MctVoid = TRUE
  LeadDrop = TRUE
  ReplayUncommitted = TRUE
  ReplayVoid = FALSE
  DiscardNA = TRUE
  ResolveTwice = FALSE
  WaitInFlight = TRUE
  SnapKeys = TRUE
  Snapshots = TRUE
  MaxCrash = 0
  LeaseToggle = FALSE
  Oversize = FALSE
  CtlId = "apply"
  CtlRecheck = TRUE
SYMMETRY Sym
SPECIFICATION Spec
INVARIANT NotAppendedNeverWrites
