\* EXPECTED TO FAIL (PolicyEnforced): no barriers. A change takes effect
\* when it commits; a front end with a stale registry commits a write the
\* tighter policy denies.
CONSTANTS
  ReqOf <- RQ1
  Changes = {"tight"}
  Barriers = FALSE
  BarrierRule = "max"
  Cutover = "barrier"
  EvalAtS = TRUE
  CheckRule = "barrier"
  MaxLen = 6
SPECIFICATION Spec
CONSTRAINT Bound
INVARIANT TypeOK BarrierCtx PolicyEnforced IndexExact ReplayEqual FreshnessSound
