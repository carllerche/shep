  Attempts = {"A"}
  Crash = TRUE
  StampMode = "decision"
  CtxPrepDots = TRUE
  ReadOnlyParts = TRUE
  OnIntent = "reject"
  PartHomeView = "prepare"
  HomeRule = "anchor"
  MatLookahead = TRUE
  ForgetRule = "deadline"
  Deadline = TRUE
  Dup = FALSE
  Barriers = TRUE
  RegCheck = "decide"
  Split = FALSE
  SplitCarry = TRUE
  Outages = FALSE
SPECIFICATION Spec
INVARIANT RegistryAtDecision RegistryLogOrder
