\* EXPECTED TO FAIL (S1): the design as written. No directory fsync after
\* creating a segment (log or kvstore) or after unlinking segments. Under
\* POSIX a crash can drop a new segment's directory entry after its data was
\* fsynced and acknowledged, or bring back an unlinked one.
CONSTANTS
  MaxAppend = 3
  MaxTerm = 2
  SegSize = 2
  MaxCrash = 2
  MaxStop = 1
  MaxSnap = 1
  MaxPrefix = 1
  SegDirSync = FALSE
  ClearMarker = TRUE
  SyncAfterTrunc = TRUE
  PersistStartFirst = TRUE
  SnapTmpSync = TRUE
  SnapDirSync = TRUE
  Rescan = TRUE
  RepairSync = TRUE
  ReopenAfterOpen = FALSE
  Gaps = "cut"
  Readers = {}
  MaxReads = 0
  TruncFlag = "atomic"
  ErrorPath = "none"
  MaxErr = 0
SPECIFICATION Spec
INVARIANT KvRecovers VoteNeverRegresses StartNeverRegresses NoReadIntoDeleted
INVARIANT FlushedSurvives RecoveredIsAppendedPrefix TruncatedNeverReappears
INVARIANT FilesPrefixRelated RunningLogMatches
