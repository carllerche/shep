\* EXPECTED TO FAIL (S4): after a clean restart, appends continue in the
\* segment the marker names (instead of a new segment) and the marker is not
\* cleared. After a crash, recovery trusts the marker's old length and drops
\* flushed entries.
CONSTANTS
  MaxAppend = 3
  MaxTerm = 2
  SegSize = 2
  MaxCrash = 2
  MaxStop = 1
  MaxSnap = 1
  MaxPrefix = 1
  SegDirSync = TRUE
  ClearMarker = TRUE
  SyncAfterTrunc = TRUE
  PersistStartFirst = TRUE
  SnapTmpSync = TRUE
  SnapDirSync = TRUE
  Rescan = TRUE
  RepairSync = TRUE
  ReopenAfterOpen = TRUE
  Gaps = "cut"
  Readers = {}
  MaxReads = 0
  TruncFlag = "atomic"
  ErrorPath = "none"
  MaxErr = 0
SPECIFICATION Spec
INVARIANT KvRecovers VoteNeverRegresses StartNeverRegresses NoReadIntoDeleted
INVARIANT FlushedSurvives RecoveredIsAppendedPrefix TruncatedNeverReappears
INVARIANT FilesPrefixRelated RunningLogMatches
