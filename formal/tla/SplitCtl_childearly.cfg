\* EXPECTED TO FAIL (OneOwner): a child accepts proposals as soon as its
\* replica exists, before its first entry commits.
CONSTANTS
  ReqKey <- RK1
  With2PC = FALSE
  RouteBy = "entry"
  HandoffResume = TRUE
  CancelRule = "parent"
  RemoveOnStart = FALSE
  ChildEarly = TRUE
  IdemInstall = TRUE
  TooOld = TRUE
  DrainGuard = TRUE
  LostReplies = FALSE
  FreshReads = FALSE
  Crashes = 1
  MaxLen = 5
SPECIFICATION Spec
CONSTRAINT Bound
INVARIANT TypeOK NoLostAck Inv_OneCommitPerKey OneOwner NoOrphanedRange ValidationComplete NoStrandedPrepare
