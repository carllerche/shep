\* FAIL (DerivedSound). incr with PendingRule = "presume": the second command
\* was derived from the first, still pending; the lease lapses, Raft refuses the
\* first at receipt (NotAppended), the lease returns and the second is appended.
\* Refusal is not prefix-closed within a term.
CONSTANTS
  Servers = {s1, s2, s3}
  Prog <- ProgTwo
  MaxSends = 1
  Emb = "incr"
  MaxTerm = 1
  MaxLen = 3
  MaxTime = 0
  Ticks = FALSE
  W = 5
  AW = 0
  WinEntries = 9
  FloorMode = "any"
  FloorRule = TRUE
  PendingRule = "presume"
  Evict = FALSE
  VoidRule = "all"
  Seed = "fix"
  MctVoid = TRUE
  LeadDrop = TRUE
  ReplayUncommitted = TRUE
  ReplayVoid = FALSE
  DiscardNA = FALSE
  ResolveTwice = FALSE
  WaitInFlight = TRUE
  SnapKeys = TRUE
  Snapshots = FALSE
  MaxCrash = 0
  LeaseToggle = TRUE
  Oversize = FALSE
  CtlId = "apply"
  CtlRecheck = TRUE
SYMMETRY Sym
SPECIFICATION Spec
INVARIANT DerivedSound
