\* EXPECTED TO FAIL (OneClusterPerSeeds): founding without the all-empty check (with the reachable empty seeds); a seed founds while another is down or already in a cluster.
CONSTANTS
  Nodes = {"a", "b", "c", "x"}
  ProdSeeds = {"a", "b", "c"}
  NpSeeds = {"x"}
  NpNodes = {"x"}
  AllEmpty = FALSE
  Guard = "seeds"
  UuidCheck = TRUE
  EnvCheck = TRUE
  Rejoin = "replace"
  SecondAs = "learner"
  PromoteCheck = TRUE
  AddGuard = TRUE
  Repurpose = FALSE
  MaxWipes = 1
  MaxCrashes = 1
  MaxLog = 4
  MaxClusters = 3
SPECIFICATION Spec
INVARIANT OneClusterPerSeeds NoNodeInTwoClusters ProdNpNeverMix GrowthKeepsQuorum CommittedKept
