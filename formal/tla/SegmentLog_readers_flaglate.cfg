\* EXPECTED TO FAIL: the flag is set in a separate step after the epoch bump.
\* A reader that reads the epoch between the two steps misses the flag.
CONSTANTS
  MaxAppend = 3
  MaxTerm = 2
  SegSize = 2
  MaxCrash = 0
  MaxStop = 0
  MaxSnap = 0
  MaxPrefix = 1
  SegDirSync = TRUE
  ClearMarker = TRUE
  SyncAfterTrunc = TRUE
  PersistStartFirst = TRUE
  SnapTmpSync = TRUE
  SnapDirSync = TRUE
  Rescan = TRUE
  RepairSync = TRUE
  ReopenAfterOpen = FALSE
  Gaps = "cut"
  Readers = {r1, r2}
  MaxReads = 1
  TruncFlag = "separate"
  ErrorPath = "none"
  MaxErr = 0
SPECIFICATION LiveSpec
INVARIANT ReadsConsistent NoSpuriousShort ReadsCorrect
PROPERTY ReadersProgress
