\* PASS. The proposed rule (HbLeaseRule) as defence in depth, checked against
\* the restore bug: a follower that rejected a request of its current term
\* (superseded, duplicate, gap) stops counting heartbeats as leader contact
\* until an append succeeds, so a leader that cannot replicate loses its
\* lease and is replaced: the group always commits again. (A single
\* follower that alone rejects the stream still waits for the counter to
\* pass the old value, as the group keeps a quorum without it.)
