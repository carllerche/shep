\* EXPECTED TO FAIL (NoDeadlock): a proposal that meets an intent waits for it
\* instead of getting contended. A and B both write x and y.
CONSTANTS
  NP = 2
  Attempts = {"A", "B"}
  Crash = FALSE
  StampMode = "decision"
  CtxPrepDots = TRUE
  ReadOnlyParts = TRUE
  OnIntent = "wait"
  PartHomeView = "prepare"
  HomeRule = "anchor"
  MatLookahead = TRUE
  ForgetRule = "deadline"
  Deadline = TRUE
  Dup = FALSE
  Barriers = FALSE
  RegCheck = "decide"
  Split = FALSE
  SplitCarry = TRUE
  Outages = FALSE
SPECIFICATION Spec
INVARIANT NoDeadlock
