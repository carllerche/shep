\* The old lens keyed on the partition's barrier entry, while freshness checks
\* count the registry dot.
CONSTANTS
  MaxWrites = 2
  LensSwitch = "barrier"
  LensKey = "barrier"
  CountDots = {"dual", "act", "abandon"}
  UniqueEnforce = "index"
  ActCheckUnique = TRUE
  ActCtx = TRUE
  BackfillValidate = TRUE
  BackfillSnap = "afterBarrier"
  Redeliver = TRUE
  CursorRemap = "remap"
  AbandonAfterBackfill = FALSE
  WritePolicy = "rejectLossy"
  BaseCheck = TRUE
  WithSplit = TRUE
  WithNext = FALSE
  WithBase = FALSE
SPECIFICATION Spec
INVARIANT Inv_Lens
