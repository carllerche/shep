  Servers = {s1, s2, s3}
  Nil = Nil
  Driver = "landed"
  MaxTerm = 2
  MaxClient = 1
  Budget = 0
  Window = 2
  MaxSess = 2
  UseSeq = FALSE
  MaxSeq = 0
  MaxBuf = 2
  MaxSlots = 1
  MaxCrash = 1
  MaxDrop = 1
  MaxDup = 0
  MaxFault = 0
  MaxXfer = 0
  MaxEnv = 0
  FreeNet = FALSE
  FreeTime = FALSE
  AtomicElect = TRUE
  Prevote = TRUE
  XferException = TRUE
  ReplyAfterFlush = TRUE
  LeaderSelf = "flushed"
  LeaderClamp = TRUE
  FollowerClamp = TRUE
  LeaderRestore = TRUE
  HbLeaseRule = FALSE
  CtrReset = FALSE
  SeqCheck = "none"
  SessionCheck = TRUE
  AckRule = "permatch"
  LwHb = TRUE
