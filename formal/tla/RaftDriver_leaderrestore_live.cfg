\* EXPECTED TO FAIL (StreamProgress). enable_leader_restore = true: the
\* restarted leader keeps its term, its followers reject its streams as
\* superseded (lower counter) or duplicate (equal counter, seq from 0), and
\* its heartbeats, outside the session check, keep their leases alive, so no
\* election replaces it: the group never commits again. (The model bounds
\* the counter at MaxSess; in the code the stall lasts until the reset
\* per-core counter passes the old value.)
