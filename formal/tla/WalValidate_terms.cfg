\* PASS. As WalValidate.cfg, with two leader changes (terms <= 3), so a
\* deposed leader's entry can be committed later by a re-elected leader, and a
\* toggle retried after an unknown outcome (2 executions) beside a guard.
CONSTANTS
  Servers = {s1, s2, s3}
  Prog <- ProgTerms
  MaxTerm = 3
  MaxLen = 4
  MaxExec = 2
  MaxWin = 0
  MaxIWin = 0
  MaxExpire = 0
  Fence = TRUE
  TableAt = "append"
  Rebuild = TRUE
  IdemAt = "append"
  CheckRanges = TRUE
  CheckTooOld = TRUE
  Truncation = FALSE
  TruncFix = FALSE
  FailMode = "logged"
  Split = FALSE
  VoidRule = FALSE
  Durability = "sync"
  MaxCrash = 0
  MarkRetry = TRUE
  HitReply = "wait"
  Refusal = "none"
  RecvOrder = "fifo"
  LeaseWindow = TRUE
SYMMETRY Sym
SPECIFICATION Spec
INVARIANT TypeOK ElectionSafety LogSafety LeaderCompleteness
INVARIANT Serializable NoUnseenConflict TooOldEnforced TablesComplete
INVARIANT RepliesDurable KeyCausal IdemOnce OneOutcome VoidNeverFires
PROPERTY DeposedCommitsNothing
