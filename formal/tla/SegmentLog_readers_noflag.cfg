\* EXPECTED TO FAIL (the original bug): no `truncating` flag. A reader reads
\* the bumped epoch, the old size, and the shrunk file, and reports "segment
\* shorter than its records".
CONSTANTS
  MaxAppend = 3
  MaxTerm = 2
  SegSize = 2
  MaxCrash = 0
  MaxStop = 0
  MaxSnap = 0
  MaxPrefix = 1
  SegDirSync = TRUE
  ClearMarker = TRUE
  SyncAfterTrunc = TRUE
  PersistStartFirst = TRUE
  SnapTmpSync = TRUE
  SnapDirSync = TRUE
  Rescan = TRUE
  RepairSync = TRUE
  ReopenAfterOpen = FALSE
  Gaps = "cut"
  Readers = {r1, r2}
  MaxReads = 1
  TruncFlag = "none"
  ErrorPath = "none"
  MaxErr = 0
SPECIFICATION LiveSpec
INVARIANT ReadsConsistent NoSpuriousShort ReadsCorrect
PROPERTY ReadersProgress
