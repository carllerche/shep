  OpsB = {"addB", "rmB", "del", "restore", "remap", "deploy"}
  Deps = FALSE
  Subs = {"u2", "g1"}
  Window = FALSE
  StepTo = "frontier"
  JoinMode = "loop"
  ReRegister = TRUE
  JoinWait = TRUE
  DenyDeletedViewer = FALSE
  LookupByViewerOnly = FALSE
  TopicStart = "latest"
SPECIFICATION Spec
INVARIANT TypeOK Monotone Published DeleteCloses PushSafe FirstAtTopic PushExact ViewExact ResyncExact
