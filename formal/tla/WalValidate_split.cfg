\* EXPECTED TO FAIL (W7): validation and append split into two steps, with
\* no void rule. A leader validates a proposal in term t, is deposed, is
\* re-elected in a later term (its tables rebuilt from a log that now holds a
\* conflicting entry), and appends the entry it validated earlier without
\* validating it again.
