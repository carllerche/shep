\* EXPECTED TO FAIL (R1): the fix as described. On an error or cancellation
\* after the file was shrunk (set_len) but before the in-memory size and
\* end were updated, the drop guard clears the flag and releases the lock
\* with the metadata still stale; the next reader reports "segment shorter
\* than its records" for entries that were kept.
CONSTANTS
  MaxAppend = 3
  MaxTerm = 2
  SegSize = 2
  MaxCrash = 0
  MaxStop = 0
  MaxSnap = 0
  MaxPrefix = 1
  SegDirSync = TRUE
  ClearMarker = TRUE
  SyncAfterTrunc = TRUE
  PersistStartFirst = TRUE
  SnapTmpSync = TRUE
  SnapDirSync = TRUE
  Rescan = TRUE
  RepairSync = TRUE
  ReopenAfterOpen = FALSE
  Gaps = "cut"
  Readers = {r1, r2}
  MaxReads = 1
  TruncFlag = "atomic"
  ErrorPath = "clear"
  MaxErr = 1
SPECIFICATION LiveSpec
INVARIANT ReadsConsistent NoSpuriousShort ReadsCorrect
PROPERTY ReadersProgress
