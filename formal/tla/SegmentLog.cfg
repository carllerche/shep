\* PASS. The protocol with the fixes for S1 (directory fsyncs: SegDirSync).
\* Every step of the design as written is kept: the marker is cleared before
\* truncation, a suffix truncation fsyncs the cut segment, a prefix truncation
\* persists the start offset first, a kvstore snapshot fsyncs the temp file
\* before the rename and the directory after it, and recovery rescans the
\* last segment and fsyncs the tail it cuts. Recovery cuts at the first gap.
\* 3 entries, terms <= 2, 2 batches per segment, 1 crash (any step,
\* including during recovery and while stopped), 1 clean shutdown, 1
\* background kvstore snapshot, 1 prefix truncation. Two crashes (a crash
\* during the recovery from a crash) are in SegmentLog_crash2.cfg.
CONSTANTS
  MaxAppend = 3
  MaxTerm = 2
  SegSize = 2
  MaxCrash = 1
  MaxStop = 1
  MaxSnap = 1
  MaxPrefix = 1
  SegDirSync = TRUE
  ClearMarker = TRUE
  SyncAfterTrunc = TRUE
  PersistStartFirst = TRUE
  SnapTmpSync = TRUE
  SnapDirSync = TRUE
  Rescan = TRUE
  RepairSync = TRUE
  ReopenAfterOpen = FALSE
  Gaps = "cut"
  Readers = {}
  MaxReads = 0
  TruncFlag = "atomic"
  ErrorPath = "none"
  MaxErr = 0
SPECIFICATION Spec
INVARIANT KvRecovers VoteNeverRegresses StartNeverRegresses NoReadIntoDeleted
INVARIANT FlushedSurvives RecoveredIsAppendedPrefix TruncatedNeverReappears
INVARIANT FilesPrefixRelated RunningLogMatches MetaMatchesFiles
