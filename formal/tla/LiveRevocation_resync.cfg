\* SUPERSEDED: the mapping model (g1's viewer is its acts_for target, re-pointed by "remap"); see LiveRevocation_cred*.cfg for the credential model.
\* Proposed: a mapped node's deletion is a permission change (resync), not a close. Expected to pass.
CONSTANTS
  MaxEntries = 5
  MaxMsgs = 2
  Ops = {"post", "add", "rm", "del", "restore", "remap", "deploy"}
  RouteDeleted = TRUE
  RouteActsFor = TRUE
  MapRouteAt = "step"
  CloseOnMapped = FALSE
  DenyDeletedViewer = FALSE
  RouteRevoke = TRUE
  LinkDeletedCheck = TRUE
  TokSubs = {}
  ExpiryCheck = TRUE
SPECIFICATION Spec
INVARIANT PushSafe ViewSafe LinkSafe PushExact ViewExact CloseOnlyIfDenied
