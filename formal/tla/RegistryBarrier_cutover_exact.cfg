\* EXPECTED TO FAIL (IndexExact): as RegistryBarrier_cutover, checking only the
\* index: backfill read the state before the barrier, so writes between the
\* backfill's snapshot and the barrier are missing from the index.
CONSTANTS
  ReqOf <- RQ2
  Changes = {"ix"}
  Barriers = TRUE
  BarrierRule = "max"
  Cutover = "none"
  EvalAtS = TRUE
  CheckRule = "barrier"
  MaxLen = 6
SPECIFICATION Spec
CONSTRAINT Bound
INVARIANT TypeOK IndexExact
