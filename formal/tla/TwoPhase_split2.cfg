\* The design (v49 §9.6, §8, §10.3). A writes x (partition 1, group g1) and y
\* (partition 2), anchored at g2 in partition 1, so partition 1 is its home.
\* Partition 1 drains and splits into C1 (g1, the lowest group: it gets the
\* decision records) and C2 (g2: A's anchor). A2 retries A's idempotency key,
\* before or after the split; after it, its home is C2. Coordinators crash,
\* deadlines pass, records are forgotten. Expected to pass.
