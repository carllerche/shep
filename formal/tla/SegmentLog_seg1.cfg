\* PASS. One batch per segment, so a suffix truncation unlinks several
\* segments and a crash between the unlinks (unordered under POSIX) can leave
\* a gap; recovery cuts at the first gap. 3 entries, 1 crash.
CONSTANTS
  MaxAppend = 3
  MaxTerm = 2
  SegSize = 1
  MaxCrash = 1
  MaxStop = 0
  MaxSnap = 0
  MaxPrefix = 0
  SegDirSync = TRUE
  ClearMarker = TRUE
  SyncAfterTrunc = TRUE
  PersistStartFirst = TRUE
  SnapTmpSync = TRUE
  SnapDirSync = TRUE
  Rescan = TRUE
  RepairSync = TRUE
  ReopenAfterOpen = FALSE
  Gaps = "cut"
  Readers = {}
  MaxReads = 0
  TruncFlag = "atomic"
  ErrorPath = "none"
  MaxErr = 0
SPECIFICATION Spec
INVARIANT KvRecovers VoteNeverRegresses StartNeverRegresses NoReadIntoDeleted
INVARIANT FlushedSurvives RecoveredIsAppendedPrefix TruncatedNeverReappears
INVARIANT FilesPrefixRelated RunningLogMatches MetaMatchesFiles
